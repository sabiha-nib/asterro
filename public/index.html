<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASTERRO</title>
<meta name="description" content="ASTERRO — Planetary Analogue Intelligence. Find Earth's environmental analogues for worlds beyond Earth. Deterministic, traceable, NASA data.">
<meta name="application-name" content="ASTERRO">
<meta property="og:title" content="ASTERRO — Planetary Analogue Intelligence">
<meta property="og:description" content="Find Earth's environmental analogues for worlds beyond Earth. Deterministic similarity on NASA, USGS and PDS data; every score traceable and reproducible.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>/* ASTERRO · Planetary Analogue Intelligence — mission-instrument visual system (single dark theme, deliberate). */
[hidden]{display:none!important}
:root{
  color-scheme: dark;
  --ground:#090B0E; --panel:#0F1317; --panel-2:#141A1F; --raise:#1A2128;
  --line:#212931; --line-2:#2E3842; --ink:#E6E9EC; --ink-2:#A4AEB9; --ink-3:#6C7783;
  --mars:#E0874F; --moon:#AFC7DA; --cross:#D6C07A; --earth:#7FB3AE;
  --accent:var(--mars); --accent-dim:#5b3520;
  --match:#8CC08F; --partial:#D8B45B; --mismatch:#D9705F;
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",system-ui,sans-serif;
  --f-body:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:3px; --bar-h:58px;
}
#app[data-target="moon_south_pole"]{--accent:var(--moon);--accent-dim:#2c3c48}
#app[data-target="cross"]{--accent:var(--cross);--accent-dim:#4a4226}
html,body{height:100%;background:var(--ground);color:var(--ink)}
body{font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:var(--bar-h) minmax(0,1fr) auto;min-height:0}
.bar,.stage,.console{min-width:0}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--ground);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);flex:none}
.brand-txt{display:flex;flex-direction:column;line-height:1;width:157px} /* = width of the previous wordmark: keeps the tab bar in place */
.brand-txt b{font:800 19px/1 var(--f-display);letter-spacing:.14em}
.brand-txt span{font:500 9.5px/1.3 var(--f-mono);letter-spacing:.18em;color:var(--ink-3)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs button{font:600 11px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;padding:9px 11px;color:var(--ink-3);border-radius:var(--r);white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--panel-2);box-shadow:inset 0 -2px 0 var(--accent)}
.target-ctl{display:flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;flex:none}
.target-ctl button{padding:6px 11px;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;border-right:1px solid var(--line)}
.target-ctl button:last-child{border-right:0}
.target-ctl i{font:500 9px/1.3 var(--f-mono);letter-spacing:.2em;font-style:normal;color:var(--ink-3)}
.target-ctl button[aria-checked="true"]{background:var(--panel-2);color:var(--ink)}
.target-ctl button[aria-checked="true"] i{color:var(--accent)}
.btn-search,.btn-primary{font:700 15px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase;background:var(--accent);color:#120c08;padding:11px 18px;border-radius:var(--r);flex:none;transition:filter .2s}
.btn-search:hover,.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{font:600 13px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--line-2);padding:11px 16px;border-radius:var(--r);color:var(--ink-2)}
.btn-ghost:hover{color:var(--ink);border-color:var(--ink-3)}
.btn-sm{font:600 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line-2);padding:8px 10px;border-radius:var(--r);color:var(--ink-2);background:var(--panel)}
.btn-sm:hover{color:var(--ink);border-color:var(--accent)}
.btn-sm.on{color:#120c08;background:var(--accent);border-color:var(--accent)}

/* ---------- stage ---------- */
.stage{display:grid;grid-template-columns:minmax(330px,390px) minmax(0,1fr) minmax(280px,320px);min-height:0;position:relative}
.panel{background:var(--panel);min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.left{border-right:1px solid var(--line)}
.right{border-left:1px solid var(--line)}
#app.is-hero .left,#app.is-hero .right{opacity:.0;pointer-events:none}
#app .left,#app .right{transition:opacity .6s ease}
#app.wide .stage{grid-template-columns:minmax(560px,760px) minmax(0,1fr) minmax(280px,320px)}

.viewport{position:relative;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 45%,#0d1319 0%,var(--ground) 70%)}
#globe{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#globe:active{cursor:grabbing}
.vp-top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;pointer-events:none;z-index:2}
.seg{display:flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:rgba(9,11,14,.78);pointer-events:auto;backdrop-filter:blur(4px)}
.seg button{font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;padding:8px 10px;color:var(--ink-3)}
.seg button[aria-pressed="true"]{color:var(--ink);background:var(--raise)}
#app.is-hero .vp-top,#app.is-hero .legend,#app.is-hero .status{opacity:0}
.legend{position:absolute;left:14px;bottom:44px;z-index:2;background:rgba(9,11,14,.8);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;min-width:220px;transition:opacity .5s}
.legend h4{margin:0 0 6px;font:500 9.5px/1 var(--f-mono);letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase}
.legend .ramp{height:8px;border-radius:1px}
.legend .ticks{display:flex;justify-content:space-between;font:400 10.5px/1.6 var(--f-mono);color:var(--ink-2)}
.legend .sw{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--ink-2)}
.legend .sw span{display:inline-flex;align-items:center;gap:6px}
.legend .sw i{width:10px;height:10px;border-radius:50%;display:inline-block}
.status{position:absolute;left:14px;right:14px;bottom:12px;font:400 10.5px/1.3 var(--f-mono);color:var(--ink-3);letter-spacing:.04em;z-index:2;transition:opacity .5s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readout{position:absolute;right:14px;bottom:40px;z-index:2;font:400 11px/1.5 var(--f-mono);color:var(--ink-2);background:rgba(9,11,14,.82);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;pointer-events:none;max-width:300px}
.readout:empty{display:none}
.readout b{color:var(--ink);font-weight:500}
.markers{position:absolute;inset:0;pointer-events:none;z-index:1}
.mk{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;font:500 10px/1 var(--f-mono);color:var(--ink);display:flex;align-items:center;gap:5px;transition:opacity .25s}
.mk i{width:9px;height:9px;border:1.5px solid var(--accent);border-radius:50%;background:rgba(9,11,14,.6);flex:none}
.mk span{background:rgba(9,11,14,.72);padding:2px 4px;border-radius:2px;letter-spacing:.06em}
.mk.sel i{width:15px;height:15px;background:var(--accent);box-shadow:0 0 0 4px rgba(224,135,79,.18)}
.mk.pick i{border-color:var(--ink);border-style:dashed}
.mk.back{opacity:0;pointer-events:none}

/* ---------- hero ---------- */
.hero{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:center;padding:32px clamp(20px,5vw,72px);background:linear-gradient(90deg,rgba(9,11,14,.94) 0%,rgba(9,11,14,.72) 44%,rgba(9,11,14,0) 75%);transition:opacity .9s ease,transform .9s ease}
#app:not(.is-hero) .hero{opacity:0;pointer-events:none;transform:translateX(-24px)}
.eyebrow{font:500 10.5px/1.4 var(--f-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin:0 0 18px}
.hero h1{font:800 clamp(52px,8.4vw,118px)/.86 var(--f-display);letter-spacing:.01em;text-transform:uppercase;margin:0;max-width:9ch;text-wrap:balance}
.hero .sub{font-size:17px;color:var(--ink-2);max-width:40ch;margin:18px 0 26px}
.hero-targets{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.ht{display:flex;align-items:center;gap:12px;border:1px solid var(--line-2);border-radius:var(--r);padding:8px 14px 8px 8px;background:rgba(15,19,23,.85);text-align:left;min-width:230px}
.ht img{width:54px;height:54px;border-radius:2px;filter:grayscale(1) contrast(1.15);flex:none}
.ht span{display:flex;flex-direction:column;line-height:1.25}
.ht i{font:500 9.5px/1.4 var(--f-mono);letter-spacing:.2em;font-style:normal;color:var(--ink-3)}
.ht b{font:700 20px/1.1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.ht em{font:400 10.5px/1.5 var(--f-mono);font-style:normal;color:var(--ink-3)}
.ht[aria-checked="true"]{border-color:var(--accent);background:rgba(20,26,31,.95)}
.ht[aria-checked="true"] i{color:var(--accent)}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-facts{font:400 11px/1.6 var(--f-mono);color:var(--ink-3);margin:22px 0 0;letter-spacing:.04em;max-width:62ch}

/* ---------- panel content ---------- */
.sec{padding:16px 18px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.lbl{font:500 10px/1.2 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl .n{color:var(--accent)}
h2.ttl{font:700 26px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:0}
h3.ttl{font:700 19px/1.05 var(--f-display);letter-spacing:.05em;text-transform:uppercase;margin:0}
.meta{font:400 11px/1.5 var(--f-mono);color:var(--ink-3)}
p.note{color:var(--ink-2);font-size:12.5px;margin:8px 0 0;max-width:62ch}
p.note.small{font-size:11.5px;color:var(--ink-3)}
.body-tag{font:500 10px/1 var(--f-mono);letter-spacing:.22em;color:var(--accent)}
.tgt-head{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center}
.tgt-head img{width:76px;height:76px;border-radius:2px;filter:grayscale(1) contrast(1.1)}
.cap{font:400 9.5px/1.4 var(--f-mono);letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.tag{display:inline-block;font:500 9px/1 var(--f-mono);letter-spacing:.14em;padding:3px 5px;border-radius:2px;border:1px solid var(--line-2);color:var(--ink-3);text-transform:uppercase;white-space:nowrap}
.tag.direct{color:var(--earth);border-color:#2e4a47}
.tag.proxy{color:var(--partial);border-color:#54452a}
.tag.na{color:var(--ink-3);border-style:dashed}
.big{font:800 54px/.9 var(--f-display);letter-spacing:.01em}
.big small{font:500 11px/1 var(--f-mono);letter-spacing:.18em;color:var(--ink-3);margin-left:8px;vertical-align:middle}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.kv{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv span{font:500 9.5px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.kv b{font:500 13px/1.3 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);overflow-wrap:anywhere}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toggles{display:flex;gap:4px}
.toggles button{font:500 9.5px/1 var(--f-mono);letter-spacing:.14em;padding:5px 7px;border-radius:2px;color:var(--ink-3);border:1px solid transparent;text-transform:uppercase}
.toggles button[aria-pressed="true"]{color:var(--ink);border-color:var(--line-2);background:var(--raise)}
.empty{color:var(--ink-3);font-size:13px;border:1px dashed var(--line-2);border-radius:var(--r);padding:14px;text-align:left}
svg text{font-family:var(--f-mono)}
.fp-svg{width:100%;height:auto;display:block}

/* criterion bars */
.cb{display:grid;grid-template-columns:104px 1fr 62px;gap:8px;align-items:center;padding:5px 0;font-size:12px}
.cb .nm{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb .v{font:400 11.5px/1 var(--f-mono);text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.track{position:relative;height:10px;background:var(--raise);border-radius:1px}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.85}
.track .mark{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink)}
.track .tmark{position:absolute;top:-4px;width:10px;height:10px;transform:translateX(-5px) rotate(45deg);border:1.5px solid var(--accent);background:var(--ground);top:0}

/* match / mismatch */
.mm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mm h5{margin:0 0 6px;font:500 10px/1 var(--f-mono);letter-spacing:.18em}
.mm ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.mm li{display:flex;gap:6px;align-items:baseline}
.mm li b{font-family:var(--f-mono);font-weight:500;width:12px;flex:none}
.c-match{color:var(--match)} .c-partial{color:var(--partial)} .c-mismatch{color:var(--mismatch)}
.mm .none{color:var(--ink-3);font-size:11.5px}

/* tables */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{font:500 9.5px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.t td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.t th.n{text-align:right}
table.t tr.hl td{background:rgba(255,255,255,.03)}
.pos{color:var(--match)} .neg{color:var(--mismatch)}

/* right rail list */
.rail-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.site{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;padding:9px 16px;border-bottom:1px solid var(--line);text-align:left;width:100%;align-items:center}
.site:hover{background:var(--panel-2)}
.site[aria-current="true"]{background:var(--raise);box-shadow:inset 3px 0 0 var(--accent)}
.site .rk{font:500 12px/1 var(--f-mono);color:var(--ink-3)}
.site .nm{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.site .sc{font:700 20px/1 var(--f-display);letter-spacing:.02em;text-align:right}
.site .sub{grid-column:2/3;font:400 10px/1.3 var(--f-mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site .mv{grid-column:3/4;font:500 10px/1 var(--f-mono);text-align:right}
.site .spark{grid-column:2/4;display:flex;gap:2px;height:4px;margin-top:3px}
.site .spark i{flex:1;background:var(--raise);position:relative;overflow:hidden}
.site .spark i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--accent);opacity:.8}
.mv.up{color:var(--match)} .mv.dn{color:var(--mismatch)}

/* console */
.console{border-top:1px solid var(--line);background:var(--ground);padding:10px 16px 10px;display:grid;grid-template-columns:1fr;gap:8px;z-index:4}
#app.is-hero .console{opacity:.0;pointer-events:none}
.console{transition:opacity .6s}
.sliders{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px 18px}
.sl{display:flex;flex-direction:column;gap:4px;min-width:0}
.sl label{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--ink-2);align-items:baseline}
.sl label b{font:500 12px/1 var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.sl .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl .foot{display:flex;justify-content:space-between;gap:6px;align-items:center}
.sl .share{font:400 10px/1 var(--f-mono);color:var(--ink-3)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:linear-gradient(90deg,var(--accent) var(--p,33%),var(--line-2) var(--p,33%))}
input[type=range]::-moz-range-track{height:3px;background:var(--line-2)}
input[type=range]::-moz-range-progress{height:3px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:16px;margin-top:-6.5px;background:var(--ink);border-radius:1px;border:0}
input[type=range]::-moz-range-thumb{width:12px;height:16px;background:var(--ink);border-radius:1px;border:0}
input[type=range]:disabled{opacity:.35}
.profiles{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.con-side{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.disclaimer{font-size:10.5px;color:var(--ink-3);max-width:78ch;text-align:right;line-height:1.35;flex:1 1 340px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(4,6,8,.72);display:flex;justify-content:center;align-items:flex-start;padding:4vh 16px;overflow-y:auto}
.sheet-card{background:var(--panel);border:1px solid var(--line-2);border-radius:4px;width:min(880px,100%);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.sheet-head h2{font:700 20px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;margin:0;flex:1}
.sheet-actions{display:flex;gap:6px}
.icon-btn{font-size:22px;line-height:1;width:32px;height:32px;border-radius:var(--r);color:var(--ink-2)}
.icon-btn:hover{background:var(--raise);color:var(--ink)}
.sheet-body{padding:18px 22px 26px}
.sheet-body h3{font:700 15px/1.2 var(--f-display);letter-spacing:.14em;text-transform:uppercase;margin:22px 0 8px;color:var(--ink-2)}
.sheet-body h3:first-child{margin-top:0}
pre.code{font:400 11.5px/1.55 var(--f-mono);background:var(--ground);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;overflow-x:auto;color:var(--ink-2);margin:0;white-space:pre}
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin:6px 0 4px}
.flow div{flex:1 1 110px;border:1px solid var(--line-2);padding:8px 10px;font:500 10px/1.35 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);position:relative;background:var(--panel-2)}
.flow div b{display:block;color:var(--ink);font:700 14px/1.1 var(--f-display);letter-spacing:.08em;margin-bottom:3px}
.flow div+div{border-left:0}
.formula{font:400 13px/1.9 var(--f-mono);background:var(--ground);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;color:var(--ink);overflow-x:auto;white-space:pre}
.callout{border-left:2px solid var(--partial);padding:8px 12px;background:rgba(216,180,91,.06);font-size:12.5px;color:var(--ink-2)}
.chip-list{display:flex;flex-wrap:wrap;gap:6px}
.whatif{border:1px solid var(--line-2);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel-2)}
.whatif q{font:700 17px/1.15 var(--f-display);letter-spacing:.04em;text-transform:uppercase;quotes:none}
.bfaf{display:flex;align-items:center;gap:14px}
.bfaf .b{display:flex;flex-direction:column}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  body{overflow:auto}
  #app{height:auto;min-height:100%;grid-template-rows:auto auto auto}

  .tabs{order:3;flex-basis:100%}
  .stage,#app.wide .stage{grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:62vh auto}
  .left{grid-column:1/3;grid-row:2;border-right:0;border-top:1px solid var(--line);overflow:visible}
  .viewport{grid-row:1;grid-column:1}
  .right{grid-row:1;grid-column:2;max-height:62vh}
  .sliders{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:760px){

  .btn-search{margin-left:auto}

  .left{grid-column:1;grid-row:3}
  .console{grid-template-columns:1fr}
  .console.collapsed .sliders{display:none}
  .con-side{align-items:flex-start}
  .disclaimer{text-align:left}
  .sliders{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{background:linear-gradient(180deg,rgba(9,11,14,.95),rgba(9,11,14,.8));justify-content:flex-start;overflow-y:auto}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>/* ASTERRO · Planetary Analogue Intelligence — deterministic engine (browser + Node).
 * Line-for-line port of src/compute/{similarity,ranking,clustering}.py.
 * Parity with the Python reference is asserted by tests/test_js_parity.mjs.
 * No randomness, no learned model, no generative component. */
(function (root) {
  "use strict";
  const MIN_COVERAGE = 0.80;
  const MATCH = 0.85, PARTIAL = 0.60;
  const R_EARTH_KM = 6371.0088;
  const N_CANDIDATES = 800, K_CHOICES = [3, 4, 5];
  const ALGORITHM_VERSION = "tai-sim-1.0.0";

  function activeCriteria(criteria, tv, w) {
    return criteria.filter(c => w[c] != null && +w[c] > 0 && tv[c] != null);
  }

  /* stack: {criterion: Float32Array}; returns Float64 arrays */
  function similarity(stack, criteria, tv, w, ranges) {
    for (const c of criteria) {
      if (w[c] == null) continue;
      if (!Number.isFinite(+w[c])) throw new Error("non-finite weight " + c);
      if (+w[c] < 0) throw new Error("negative weight " + c);
    }
    const act = activeCriteria(criteria, tv, w);
    if (!act.length) throw new Error("no active criteria");
    let totalW = 0; for (const c of act) totalW += +w[c];
    const n = stack[act[0]].length;
    const num = new Float64Array(n), wsum = new Float64Array(n);
    for (const c of act) {
      const e = stack[c], t = +tv[c], lo = ranges[c][0], span = ranges[c][1] - ranges[c][0], wc = +w[c];
      if (!(Number.isFinite(lo) && Number.isFinite(span) && span > 0)) throw new Error("undefined normalization range " + c);
      for (let i = 0; i < n; i++) {
        const x = e[i];
        if (x - x !== 0) continue;                   // NaN or ±Infinity: missing Earth value
        let s = 1 - Math.abs(x - t) / span;
        s = s < 0 ? 0 : (s > 1 ? 1 : s);
        num[i] += wc * s; wsum[i] += wc;
      }
    }
    const final = new Float64Array(n), coverage = new Float64Array(n), eff = new Float64Array(n);
    const eligible = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      final[i] = wsum[i] > 0 ? num[i] / wsum[i] : NaN;
      coverage[i] = wsum[i] / totalW;
      eligible[i] = coverage[i] >= MIN_COVERAGE - 1e-12 ? 1 : 0;
      eff[i] = eligible[i] && final[i] === final[i] ? final[i] : -1;
    }
    return { final, coverage, eligible, eff, active: act, totalW };
  }

  /* Full per-criterion breakdown for ONE cell (trace). */
  function detail(stack, criteria, i, tv, w, ranges) {
    const act = activeCriteria(criteria, tv, w);
    let wsum = 0; const rows = [];
    for (const c of criteria) {
      const e0 = stack[c][i], e = e0 - e0 === 0 ? e0 : NaN, t = tv[c], on = act.includes(c);

/* ===== 03 compute: deterministic pipeline (all numbers come from TAIEngine) ===== */
const TARGET_IDS = ["mars_jezero", "moon_south_pole"];
const simCache = new Map();

function simFor(tid, w) {
  const key = tid + "|" + S.critIds.map(c => (+w[c]).toFixed(4)).join(",");
  if (simCache.has(key)) return simCache.get(key);
  const r = ENG.similarity(S.A, S.critIds, S.T[tid].variables, w, S.ranges);
  if (simCache.size > 24) simCache.delete(simCache.keys().next().value);
  simCache.set(key, r); return r;
}
/* rank of one cell without sorting: 1 + #cells ordered ahead of it (same tie-break as the sort) */
function rankOf(eff, i) {
  if (eff[i] < 0) return null;
  const e = eff[i], c = S.cell[i]; let k = 1;
  for (let j = 0; j < S.n; j++) { const v = eff[j]; if (v > e || (v === e && S.cell[j] < c)) k++; }
  return k;
}
function effectiveFor(tid, w) {
  if (tid !== "cross") return simFor(tid, w).eff;
  const a = simFor(TARGET_IDS[0], w).eff, b = simFor(TARGET_IDS[1], w).eff, out = new Float64Array(S.n);
  for (let i = 0; i < S.n; i++) out[i] = (a[i] < 0 || b[i] < 0) ? -1 : Math.min(a[i], b[i]);
  return out;
}

function compute() {
  const t0 = performance.now(), tid = S.targetId, w = S.weights;
  let r = null, rJ = null, rM = null;
  if (tid === "cross") { rJ = simFor(TARGET_IDS[0], w); rM = simFor(TARGET_IDS[1], w); }
  else r = simFor(tid, w);
  const eff = effectiveFor(tid, w);
  const order = ENG.order(eff, S.cell);
  const rank = ENG.ranksFromOrder(order);
  let nElig = 0; for (let i = 0; i < S.n; i++) if (eff[i] >= 0) nElig++;
  const distinct = ENG.distinctSites(order, S.lat, S.lon, 20, S.app.thresholds.distinct_sep_km);
  const hi = eff[order[0]], lo = eff[order[Math.floor(nElig / 2)]];
  const active = tid === "cross" ? Array.from(new Set([...rJ.active, ...rM.active])) : r.active;
  S.res = { tid, w: { ...w }, r, rJ, rM, eff, order, rank, nElig, distinct, lo, hi, active, clusters: null };
  S.computeMs = performance.now() - t0;
  scheduleClusters();
  return S.res;
}

let clusterTimer = null;
function scheduleClusters() {
  clearTimeout(clusterTimer);
  clusterTimer = setTimeout(() => { computeClusters(); paintField(); renderAll(["right", "left"]); }, 140);
}
function normOf(i, c) { const v = S.A[c][i], R = S.ranges[c]; return v === v ? (v - R[0]) / (R[1] - R[0]) : NaN; }
function computeClusters() {
  const R = S.res; if (!R) return;
  const cl = ENG.constellations(R.order, R.active, normOf);
  const groups = [];
  for (let g = 0; g < cl.k; g++) groups.push({ id: g, members: [] });
  cl.candidates.forEach((i, r) => groups[cl.labels[r]].members.push(i));
  for (const G of groups) {
    const m = G.members, mean = f => { let s = 0, k = 0; for (const i of m) { const v = f(i); if (v === v) { s += v; k++; } } return k ? s / k : NaN; };
    G.stats = { aridity: mean(i => S.A.aridity[i]), t2m_mean_c: mean(i => S.A.t2m_mean_c[i]), slope: mean(i => S.A.slope[i]),
                elevation: mean(i => S.A.elevation[i]), lst: mean(i => S.A.lst_diurnal_range[i]), score: mean(i => R.eff[i]) };
    G.name = ENG.describe(G.stats);
    G.area = m.reduce((a, i) => a + cellArea(i), 0);
    G.best = m[0];                         // members are in rank order
    const cc = new Map(); for (const i of m) { const k = placeName(i).secondary || placeName(i).primary; cc.set(k, (cc.get(k) || 0) + 1); }
    G.countries = [...cc.entries()].sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1)).slice(0, 3);
  }
  // order constellations by mean score (deterministic), keep ids for colours
  groups.sort((a, b) => b.stats.score - a.stats.score || a.id - b.id);
  groups.forEach((G, k) => G.rankNo = k + 1);
  R.clusters = { k: cl.k, silhouette: cl.silhouette, groups, member: new Int8Array(S.n).fill(-1), threshold: R.eff[cl.candidates[cl.candidates.length - 1]] };
  for (const G of groups) for (const i of G.members) R.clusters.member[i] = G.rankNo - 1;
}

/* per-cell breakdown (trace) — current or arbitrary weights */
function detailFor(tid, i, w = S.weights) { return ENG.detail(S.A, S.critIds, i, S.T[tid].variables, w, S.ranges); }

function paintField() {
  const R = S.res, g = window.GLOBE; if (!R || !g) return;
  const d = g.fieldData; d.fill(0);
  const n = R.nElig, prev = S.prev && S.prev.tid === R.tid ? S.prev : null;
  const pN = prev ? Math.max(1, prev.nElig - 1) : 1, dMax = 0.25;   // change layer: relative-rank (percentile) change
  for (let k = 0; k < S.n; k++) {
    const i = R.order[k], c = S.cell[i] * 4, e = R.eff[i];
    d[c] = e < 0 ? 0 : Math.round(e * 255);
    d[c + 1] = e < 0 ? 255 : Math.round(255 * (1 - k / Math.max(1, n - 1)));
    d[c + 2] = R.clusters ? R.clusters.member[i] + 1 : 0;
    let code = 128;
    if (prev && e >= 0 && prev.eff[i] >= 0) {
      const pNow = 1 - k / Math.max(1, n - 1), pWas = 1 - (prev.rank[i] - 1) / pN;
      code = Math.round(128 + clamp((pNow - pWas) / dMax, -1, 1) * 127);

/* analogue evolution: yearly LST replaces the climatological LST, everything else fixed */
function evolution(tid, i, w = S.weights) {
  const Y = S.app.stack.years, out = [];
  const yr = S.A.lst_diurnal_range_yearly;
  for (let y = 0; y < Y.length; y++) {
    const raw = yr[y * S.n + i]; const v = raw === -32768 ? NaN : raw * 0.01;
    const st = {}; for (const c of S.critIds) st[c] = new Float32Array([c === "lst_diurnal_range" ? v : S.A[c][i]]);
    const scoreOf = t => { const r = ENG.similarity(st, S.critIds, S.T[t].variables, w, S.ranges); return r.eff[0]; };
    const s = tid === "cross" ? Math.min(scoreOf(TARGET_IDS[0]), scoreOf(TARGET_IDS[1])) : scoreOf(tid);
    out.push({ year: Y[y], lst: v, score: v === v ? s : null });
  }
  const sc = out.filter(o => o.score != null && o.score >= 0).map(o => o.score);
  const range = sc.length ? (Math.max(...sc) - Math.min(...sc)) * 100 : null;
  const cls = range == null ? "DATA NOT AVAILABLE" : (range <= S.app.thresholds.evolution_stable_pts ? "STABLE ANALOGUE" : "VARIABLE ANALOGUE");
  return { series: out, rangePts: range, cls, years: sc.length };
}

function stability(tid, i) {
  const rows = [];
  for (const [pid, p] of Object.entries(S.app.profiles)) {
    const eff = effectiveFor(tid, p.weights); rows.push({ pid, label: p.label, rank: rankOf(eff, i), score: eff[i] });
  }
  return rows;
}
function profileFor(i, w = S.weights) {   // reverse search: one Earth cell against every target
  return TARGET_IDS.map(t => { const r = simFor(t, w); return { tid: t, score: r.eff[i], rank: rankOf(r.eff, i), cov: r.coverage[i] }; });
}
function paretoFront(w = S.weights, limit = 14) {
  const a = simFor(TARGET_IDS[0], w).eff, b = simFor(TARGET_IDS[1], w).eff, idx = [];
  for (let i = 0; i < S.n; i++) if (a[i] >= 0 && b[i] >= 0) idx.push(i);
  idx.sort((x, y) => (a[y] - a[x]) || (b[y] - b[x]) || (S.cell[x] - S.cell[y]));
  const front = []; let best = -1;
  for (const i of idx) if (b[i] > best) { front.push(i); best = b[i]; }
  return { front, a, b, count: idx.length };
}
function dataQuality(i, tid) {
  const t = tid === "cross" ? null : S.T[tid];
  const w = S.weights, act = S.res.active;
  let proxies = 0; const tl = tid === "cross" ? TARGET_IDS.map(x => S.T[x]) : [t];
  const pset = new Set(); for (const tt of tl) for (const c of act) if (tt.proxy_flags[c] && +w[c] > 0) pset.add(c);
  proxies = pset.size;
  const cov = tid === "cross" ? Math.min(S.res.rJ.coverage[i], S.res.rM.coverage[i]) : S.res.r.coverage[i];
  const [dy, dx] = cellDims(i);

const THUMB = { mars_jezero: "data/thumb_jezero_mola.png", moon_south_pole: "data/thumb_southpole_lola.png" };
const THUMB_CAP = { mars_jezero: "Scientific data · MOLA 463 m hillshade · 55.6 km window", moon_south_pole: "Scientific data · LOLA 118 m hillshade · polar stereographic" };
const GLYPH = { MATCH: "✓", PARTIAL: "△", MISMATCH: "×" };
const CLS = { MATCH: "c-match", PARTIAL: "c-partial", MISMATCH: "c-mismatch" };

function compTag(tid, c) {
  if (tid === "cross") return "";
  const t = S.T[tid], k = t.comparison[c] || "";
  if (k.startsWith("proxy")) return `<span class="tag proxy" title="${esc(t.methodology[c])}">Proxy</span>`;
  if (k.startsWith("not")) return `<span class="tag na" title="${esc(t.methodology[c])}">N/A</span>`;
  return `<span class="tag direct" title="${esc(t.methodology[c])}">Direct</span>`;
}

/* ---------------- charts ---------------- */
function radialSVG(rows, withSite, size = 300) {
  const n = rows.length, cx = size / 2, cy = size / 2 + 4, R = size * 0.34;
  const ang = k => -Math.PI / 2 + k * 2 * Math.PI / n, P = (k, r) => [cx + Math.cos(ang(k)) * R * r, cy + Math.sin(ang(k)) * R * r];
  let s = `<svg class="fp-svg" viewBox="0 0 ${size} ${size + 8}" role="img" aria-label="Radial fingerprint of normalized criterion values">`;
  for (const q of [0.25, 0.5, 0.75, 1]) s += `<polygon points="${rows.map((_, k) => P(k, q).join(",")).join(" ")}" style="fill:none;stroke:var(--line-2);stroke-width:${q === 1 ? 1 : .6}"/>`;
  rows.forEach((r, k) => {
    const [x, y] = P(k, 1.0), [lx, ly] = P(k, 1.2);
    s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" style="stroke:var(--line-2);stroke-width:.6${r.tn == null ? ';stroke-dasharray:3 3' : ''}"/>`;
    s += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" style="fill:var(--ink-3);font-size:9.5px;letter-spacing:.08em">${shortOf(r.c)}</text>`;
  });
  const poly = (key, stroke, fill, dash) => {
    const pts = rows.map((r, k) => r[key] == null ? null : P(k, clamp(r[key], 0, 1)));
    const ok = pts.filter(Boolean);
    return `<polygon points="${ok.map(p => p.join(",")).join(" ")}" style="fill:${fill};stroke:${stroke};stroke-width:1.6;${dash ? 'stroke-dasharray:4 3;' : ''}"/>` +
      ok.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" style="fill:${stroke}"/>`).join("");
  };
  s += poly("tn", "var(--accent)", "var(--accent);fill-opacity:.1");
  if (withSite) s += poly("en", "var(--ink)", "var(--ink);fill-opacity:.05", true);
  return s + `</svg>`;
}
function barsHTML(rows, withSite, tid) {
  return rows.map(r => {
    const t = r.tn == null ? "" : `<i class="tmark" style="left:${(clamp(r.tn, 0, 1) * 100).toFixed(1)}%"></i>`;
    const e = withSite && r.en != null ? `<i class="mark" style="left:${(clamp(r.en, 0, 1) * 100).toFixed(1)}%"></i>` : "";
    const fill = withSite && r.s != null ? `<i class="fill" style="width:${(r.s * 100).toFixed(1)}%;opacity:.28"></i>` : "";
    const v = withSite ? (r.s != null ? fmtPct(r.s, 0) : "N/A") : (r.t == null ? "N/A" : fmtVal(r.c, r.t) + " " + unitOf(r.c));
    return `<div class="cb"><span class="nm" title="${esc(labelOf(r.c))}">${esc(labelOf(r.c))}</span><div class="track">${fill}${t}${e}</div><span class="v">${v}</span></div>`;
  }).join("") + `<p class="note small">◇ target position${withSite ? " · | selected Earth cell · shaded bar = criterion similarity" : ""} · scale = normalization range (min–max of Earth cells ∪ targets).</p>`;
}
function matrixHTML(rows, withSite) {
  return `<div class="tbl-wrap"><table class="t"><thead><tr><th>Criterion</th><th class="n">Target</th>${withSite ? '<th class="n">Earth</th><th class="n">|Δ| norm.</th><th class="n">s</th><th></th>' : '<th class="n">Norm.</th>'}</tr></thead><tbody>` +
    rows.map(r => {
      const cls = r.s != null ? ENG.classify(r.s) : null;
      return `<tr><td>${esc(shortOf(r.c))}</td><td class="n">${r.t == null ? "N/A" : fmtVal(r.c, r.t)}</td>` +
        (withSite ? `<td class="n">${fmtVal(r.c, r.e)}</td><td class="n">${r.d != null ? r.d.toFixed(3) : "—"}</td><td class="n">${r.s != null ? r.s.toFixed(3) : "—"}</td><td class="${cls ? CLS[cls] : ''}">${cls ? GLYPH[cls] : ''}</td>`
          : `<td class="n">${r.tn == null ? "—" : r.tn.toFixed(3)}</td>`) + `</tr>`;
    }).join("") + `</tbody></table></div>`;
}
function fingerprintBlock(tid, i) {
  if (tid === "cross") return `<p class="note">Cross-planet mode combines both fingerprints. Switch to a single target to view its fingerprint.</p>`;
  const withSite = i != null;
  const rows = withSite ? detailFor(tid, i).rows : S.critIds.map(c => { const t = S.T[tid].variables[c], R = S.ranges[c]; return { c, t, tn: t == null ? null : (t - R[0]) / (R[1] - R[0]) }; });
  const m = S.fpMode;
  const body = m === "radial" ? radialSVG(rows, withSite) : m === "bars" ? barsHTML(rows, withSite, tid) : matrixHTML(rows, withSite);
  const legend = m === "radial" ? `<p class="note small"><span style="color:var(--accent)">━</span> ${esc(TNAME[tid])} ${withSite ? '&nbsp; <span style="color:var(--ink)">┅</span> selected Earth cell' : ''} · radius = position in normalization range.</p>` : "";
  return `<div class="lbl">Planetary fingerprint${withSite ? " · target vs Earth" : ""}<span class="toggles" role="group" aria-label="Fingerprint view">
    ${["radial", "bars", "matrix"].map(k => `<button data-fp="${k}" aria-pressed="${m === k}">${k}</button>`).join("")}</span></div>${body}${legend}`;
}
function dnaSVG(i, tid) {
  const groups = [["CLIMATE", ["aridity", "annual_temperature_range"]], ["TERRAIN", ["elevation", "slope", "surface_roughness"]], ["THERMAL", ["lst_diurnal_range"]]];
  const W = 344, H = 132, bw = 34, gap = 12, ggap = 20, top = 16, h = 72;
  let x = 6, s = `<svg class="fp-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Analogue DNA: normalized environmental values of the selected Earth cell">`;
  for (const [g, cs] of groups) {
    const gx = x;
    for (const c of cs) {
      const v = normOf(i, c), R = S.ranges[c];
      const tv = tid !== "cross" && S.T[tid].variables[c] != null ? (S.T[tid].variables[c] - R[0]) / (R[1] - R[0]) : null;
      s += `<rect x="${x}" y="${top}" width="${bw}" height="${h}" style="fill:var(--raise)"/>`;
      if (v === v) {
        const bh = clamp(v, 0, 1) * h;
        s += `<rect x="${x}" y="${(top + h - bh).toFixed(2)}" width="${bw}" height="${bh.toFixed(2)}" style="fill:var(--ink);opacity:.82"/>`;
        for (let b = 1; b < 12; b++) s += `<line x1="${x}" x2="${x + bw}" y1="${(top + b * h / 12).toFixed(2)}" y2="${(top + b * h / 12).toFixed(2)}" style="stroke:var(--panel);stroke-width:1.4"/>`;
      } else s += `<text x="${x + bw / 2}" y="${top + h / 2}" text-anchor="middle" style="fill:var(--ink-3);font-size:9px">N/A</text>`;
      if (tv != null) s += `<line x1="${x - 3}" x2="${x + bw + 3}" y1="${top + h - clamp(tv, 0, 1) * h}" y2="${top + h - clamp(tv, 0, 1) * h}" style="stroke:var(--accent);stroke-width:2"/>`;
      s += `<text x="${x + bw / 2}" y="${top + h + 13}" text-anchor="middle" style="fill:var(--ink-2);font-size:8.5px">${shortOf(c)}</text>`;
      s += `<text x="${x + bw / 2}" y="${top + h + 25}" text-anchor="middle" style="fill:var(--ink-3);font-size:8.5px">${fmtVal(c, S.A[c][i])}</text>`;
      x += bw + gap;
    }
    s += `<text x="${gx}" y="10" style="fill:var(--ink-3);font-size:8.5px;letter-spacing:.18em">${g}</text>`;
    x += ggap - gap;
  }
  return s + `</svg><p class="note small">Bars: this cell's values within Earth's normalization range (data only). <span style="color:var(--accent)">━</span> target level.</p>`;
}
function matchBlock(rows) {
  const b = { MATCH: [], PARTIAL: [], MISMATCH: [] };
  for (const r of rows) if (r.s != null) b[ENG.classify(r.s)].push(r);
  for (const k in b) b[k].sort((x, y) => y.s - x.s);
  const col = k => `<div><h5 class="${CLS[k]}">${k}</h5><ul>${b[k].length ? b[k].map(r => `<li><b class="${CLS[k]}">${GLYPH[k]}</b><span>${esc(labelOf(r.c))} <span class="meta">${fmtPct(r.s, 0)}</span></span></li>`).join("") : '<li class="none">none</li>'}</ul></div>`;
  const na = rows.filter(r => r.s == null && r.active === false && r.t == null);
  return `<div class="lbl">Match / mismatch<span class="meta">s ≥ ${S.app.thresholds.match} ✓ · ≥ ${S.app.thresholds.partial} △</span></div><div class="mm">${col("MATCH")}${col("PARTIAL")}${col("MISMATCH")}</div>` +
    (na.length ? `<p class="note small">Not applicable to this target: ${na.map(r => esc(labelOf(r.c))).join(", ")}.</p>` : "");
}
function radarSVG(rows, size = 220) {    // mismatch radar: criterion similarity s
  const act = rows.filter(r => r.s != null), n = act.length; if (n < 3) return "";
  const cx = size / 2, cy = size / 2, R = size * 0.36, P = (k, r) => [cx + Math.cos(-Math.PI / 2 + k * 2 * Math.PI / n) * R * r, cy + Math.sin(-Math.PI / 2 + k * 2 * Math.PI / n) * R * r];
  let s = `<svg class="fp-svg" viewBox="0 0 ${size} ${size}" role="img" aria-label="Mismatch radar of criterion similarities">`;
  for (const q of [S.app.thresholds.partial, S.app.thresholds.match, 1]) s += `<polygon points="${act.map((_, k) => P(k, q).join(",")).join(" ")}" style="fill:none;stroke:${q === 1 ? 'var(--line-2)' : q === S.app.thresholds.match ? 'var(--match)' : 'var(--partial)'};stroke-width:.7;stroke-dasharray:${q === 1 ? '0' : '2 3'};opacity:.8"/>`;
  s += `<polygon points="${act.map((r, k) => P(k, r.s).join(",")).join(" ")}" style="fill:var(--accent);fill-opacity:.16;stroke:var(--accent);stroke-width:1.5"/>`;
  act.forEach((r, k) => { const [x, y] = P(k, r.s), [lx, ly] = P(k, 1.22), c = ENG.classify(r.s);
    s += `<circle cx="${x}" cy="${y}" r="3" style="fill:var(--${c === 'MATCH' ? 'match' : c === 'PARTIAL' ? 'partial' : 'mismatch'})"/><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" style="fill:var(--ink-3);font-size:9px">${shortOf(r.c)} ${GLYPH[c]}</text>`; });
  return s + `</svg>`;
}
function contribTable(det, title = "Criterion breakdown") {
  return `<div class="lbl">${title}<span class="meta">Σ contributions = score</span></div><div class="tbl-wrap"><table class="t"><thead><tr><th>Criterion</th><th class="n">Earth</th><th class="n">Target</th><th class="n">s</th><th class="n">w</th><th class="n">Contrib.</th></tr></thead><tbody>` +
    det.rows.map(r => `<tr${r.active ? "" : ' style="opacity:.45"'}><td>${esc(shortOf(r.c))} <span class="meta">${unitOf(r.c)}</span></td><td class="n">${fmtVal(r.c, r.e)}</td><td class="n">${r.t == null ? "N/A" : fmtVal(r.c, r.t)}</td><td class="n">${r.s != null ? r.s.toFixed(3) : "—"}</td><td class="n">${r.w.toFixed(2)}</td><td class="n">${r.k != null ? (100 * r.k).toFixed(2) + " pts" : "—"}</td></tr>`).join("") +
    `<tr class="hl"><td><b>Final score</b></td><td></td><td></td><td></td><td class="n">${det.wsum.toFixed(2)}</td><td class="n"><b>${(100 * det.final).toFixed(2)} pts</b></td></tr></tbody></table></div>`;
}
function qualityBlock(i, tid) {
  const q = dataQuality(i, tid);
  return `<div class="lbl">Data quality indicator<span class="meta">not a statistical confidence</span></div><div class="grid2">
    <div class="kv"><span>Weight coverage</span><b>${fmtPct(q.coverage, 0)}</b></div>
    <div class="kv"><span>MODIS month coverage</span><b>${fmtPct(q.modis, 0)}</b></div>
    <div class="kv"><span>Proxy variables</span><b>${q.proxies} of ${q.active} active</b></div>
    <div class="kv"><span>GMTED land fraction</span><b>${fmtPct(q.land, 0)}</b></div>
    <div class="kv" style="grid-column:1/3"><span>Spatial resolution</span><b>${q.res}</b></div>
    ${q.missing.length ? `<div class="kv" style="grid-column:1/3"><span>Missing at this cell</span><b style="color:var(--partial)">${q.missing.map(labelOf).join(", ")} — DATA NOT AVAILABLE (scored on remaining criteria)</b></div>` : ""}
  </div>`;
}
function evolutionSVG(ev) {
  const W = 330, H = 96, L = 30, Rr = 8, T = 10, B = 22, pts = ev.series.filter(p => p.score != null && p.score >= 0);
  if (pts.length < 2) return `<p class="note">DATA NOT AVAILABLE — fewer than two valid years.</p>`;
  const ys = pts.map(p => p.score * 100), lo = Math.floor(Math.min(...ys) - 1), hi = Math.ceil(Math.max(...ys) + 1);
  const X = y => L + (y - ev.series[0].year) / (ev.series[ev.series.length - 1].year - ev.series[0].year) * (W - L - Rr), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let s = `<svg class="fp-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Analogue evolution: yearly similarity">`;
  for (const v of [lo, (lo + hi) / 2, hi]) s += `<line x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line);stroke-width:.7"/><text x="${L - 4}" y="${Y(v) + 3}" text-anchor="end" style="fill:var(--ink-3);font-size:8.5px">${v.toFixed(0)}%</text>`;
  const path = pts.map((p, k) => (k ? "L" : "M") + X(p.year).toFixed(1) + "," + Y(p.score * 100).toFixed(1)).join("");
  s += `<path d="${path} L${X(pts[pts.length - 1].year)},${H - B} L${X(pts[0].year)},${H - B}Z" style="fill:var(--accent);opacity:.12"/><path d="${path}" style="fill:none;stroke:var(--accent);stroke-width:1.6"/>`;
  pts.forEach((p, k) => s += `<circle cx="${X(p.year)}" cy="${Y(p.score * 100)}" r="${k === pts.length - 1 ? 3.2 : 2}" style="fill:var(--accent)"/>`);
  ev.series.forEach((p, k) => { if (k % 3 === 0 || k === ev.series.length - 1) s += `<text x="${X(p.year)}" y="${H - 7}" text-anchor="middle" style="fill:var(--ink-3);font-size:8.5px">${p.year}</text>`; });
  return s + `</svg>`;
}

/* ---------------- right rail ---------------- */
function renderRight() {
  const R = S.res, box = $("#right"); if (!R) { box.innerHTML = ""; return; }
  const prevPos = new Map(); if (S.prev && S.prev.tid === R.tid) S.prev.distinct.forEach((i, k) => prevPos.set(i, k));
  let h = `<div class="rail-head"><div class="lbl" style="margin:0 0 4px">Analogue field<span class="n">${esc(TNAME[R.tid])}</span></div>
    <div class="meta" title="Top ${R.distinct.length} distinct sites (≥ ${S.app.thresholds.distinct_sep_km} km apart) of ${R.nElig.toLocaleString()} ranked cells; Analogue Score under ${esc(currentLabel())}">${R.distinct.length} distinct sites ≥ ${S.app.thresholds.distinct_sep_km} km apart · ${R.nElig.toLocaleString()} ranked · under ${esc(currentLabel())}</div></div>`;
  R.distinct.forEach((i, k) => {
    const p = placeName(i); let mv = "";
    if (S.prev && S.prev.tid === R.tid) { const pk = prevPos.get(i); mv = pk == null ? '<span class="mv up">NEW</span>' : pk > k ? `<span class="mv up">▲${pk - k}</span>` : pk < k ? `<span class="mv dn">▼${k - pk}</span>` : ""; }
    let spark = "";
    if (R.tid === "cross") spark = TARGET_IDS.map(t => `<i style="--w:${(100 * clamp(R[t === TARGET_IDS[0] ? "rJ" : "rM"].eff[i], 0, 1)).toFixed(0)}%"></i>`).join("");
    else { const d = detailFor(R.tid, i).rows.filter(r => r.s != null); spark = d.map(r => `<i title="${esc(shortOf(r.c))} ${fmtPct(r.s, 0)}" style="--w:${(100 * r.s).toFixed(0)}%"></i>`).join(""); }
    h += `<button class="site" data-cell="${i}" aria-current="${S.selected === i}" id="site-${k}"><span class="rk">#${pad2(k + 1)}</span><span class="nm">${esc(p.primary)}</span><span class="sc">${fmtPct(R.eff[i])}</span>
      <span class="sub">${esc(p.secondary || "")} · ${fmtLat(S.lat[i])} ${fmtLon(S.lon[i])} · cell #${R.rank[i]}</span>${mv}<span class="spark">${spark}</span></button>`;
  });
  h += `<button class="btn-sm rail-more" data-railmore>${box.classList.contains("open") ? "Show top 6" : "Show all 20"}</button>`;
  box.innerHTML = h;
}

/* ---------------- left panel per tab ---------------- */
function targetBlock(tid) {
  if (tid === "cross") {
    return `<div class="sec"><div class="body-tag">MARS + MOON</div><h2 class="ttl" style="margin:4px 0 6px">Cross-planet analogues</h2>
      <p class="note">Score = min(S<sub>Jezero</sub>, S<sub>South Pole</sub>): a cell ranks high only if it resembles <b>both</b> targets on the selected criteria. No cell is called universally superior — see the Pareto set in Compare.</p></div>`;
  }
  const t = S.T[tid];
  return `<div class="sec"><div class="tgt-head"><img src="${THUMB[tid]}" alt="${esc(THUMB_CAP[tid])}"><div>
    <div class="body-tag">${t.body.toUpperCase()}</div><h2 class="ttl" style="margin:3px 0 4px">${esc(t.name)}</h2>
    <div class="meta">${fmtLat(t.location.lat)} ${fmtLon(t.location.lon_east)} · ${t.location.window_km} km window</div></div></div>
    <div class="cap" style="margin-top:6px">${esc(THUMB_CAP[tid])}</div></div>`;
}
function selectedHeader(i) {
  const R = S.res, p = placeName(i), pos = R.distinct.indexOf(i);
  return `<div class="lbl">${pos >= 0 ? "Analogue #" + pad2(pos + 1) : (S.picked === i ? "Picked location · reverse search" : "Earth cell")}<span class="meta">cell rank #${R.rank[i]?.toLocaleString() ?? "—"} / ${R.nElig.toLocaleString()}</span></div>
    <h3 class="ttl">${esc(p.primary)}</h3><div class="meta" style="margin:3px 0 10px">${esc(p.secondary || "")} · ${fmtLat(S.lat[i])} ${fmtLon(S.lon[i])} · under ${esc(currentLabel())}</div>

    <div class="row"><button class="btn-sm" data-act="trace">Trace result</button><button class="btn-sm" data-act="report">Report</button></div></div>`;
}

  if (i == null) {
    h += `<div class="sec"><div class="empty">${S.searched ? "Select a site from the analogue field, or click anywhere on Earth to read its planetary analogue profile." : "Press <b>Search Earth</b> to compare every valid Earth cell against this fingerprint."}</div></div>`;

  }

    ${pr.map(p => `<tr><td>${TNAME[p.tid]}</td><td class="n">${fmtPct(p.score)}</td><td class="n">${p.rank ? "#" + p.rank.toLocaleString() : "not ranked"}</td></tr>`).join("")}</tbody></table></div>`;

}
function crossPlot() {
  const pf = paretoFront();

function currentLabel() { return S.profile === "custom" ? "Custom weights" : S.app.profiles[S.profile].label; }
function snapshot() { const R = S.res; return { tid: R.tid, w: { ...R.w }, eff: R.eff, rank: R.rank, nElig: R.nElig, distinct: R.distinct.slice(), label: currentLabel() }; }
function detectProfile(w) {
  for (const [pid, p] of Object.entries(S.app.profiles)) if (S.critIds.every(c => Math.abs(+p.weights[c] - +w[c]) < 1e-9)) return pid;

/* A weight vector is usable only if every selected target keeps >= 1 active criterion

function weightsValid(w) {
  if (!S.critIds.every(c => Number.isFinite(+w[c]) && +w[c] >= 0)) return false;
  const tids = S.targetId === "cross" ? TARGET_IDS : [S.targetId];
  return tids.every(t => ENG.activeCriteria(S.critIds, S.T[t].variables, w).length > 0);

function commitWeights(w, why) {
  if (!weightsValid(w)) { announce(INVALID_W_MSG); renderStatus(INVALID_W_MSG); renderConsole(); return; }
  S.prev = snapshot(); S.weights = { ...w }; S.profile = detectProfile(w);
  compute(); paintField(); renderAll(); renderConsole();
  const R = S.res, i = R.distinct[0];

}
let dragBase = null, raf = 0;

  }
  if (!dragBase) { dragBase = snapshot(); S.prev = dragBase; }
  S.weights = { ...w }; S.profile = detectProfile(w);

}

/* ---------- data (lazy, checksummed) ---------- */
async function labCtx() {
  if (L.ctx || L.ctxErr) return L.ctx;
  try {
    const r = await fetch("data/phase2/context.json"); if (!r.ok) throw new Error("data/phase2/context.json → HTTP " + r.status);
    const c = await r.json();
    if (c.stack_sha256 !== S.app.stack.sha256) throw new Error("Phase II context was built for a different predictor stack (" + c.stack_sha256.slice(0, 12) + "…).");
    L.ctx = c;
  } catch (e) { L.ctxErr = e.message; }
  return L.ctx;
}
async function labSeries() {
  if (L.series || L.seriesErr) return L.series;
  const c = await labCtx(); if (!c) { L.seriesErr = L.ctxErr; return null; }
  L.seriesLoading = true; labRender();
  try {
    const r = await fetch("data/phase2/" + c.series.file); if (!r.ok) throw new Error("series → HTTP " + r.status);
    const bs = atob((await r.text()).trim()), u8 = new Uint8Array(bs.length);
    for (let k = 0; k < bs.length; k++) u8[k] = bs.charCodeAt(k);
    const h = Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256", u8.buffer)), b => b.toString(16).padStart(2, "0")).join("");
    if (h !== c.series.sha256) throw new Error("Phase II series checksum mismatch; data not used.");
    const TA = { int16: Int16Array, uint16: Uint16Array }, out = {};
    for (const Ly of c.series.layout) out[Ly.name] = Object.assign(new TA[Ly.dtype](u8.buffer, Ly.offset, Ly.length), { meta: Ly });
    L.series = out;
  } catch (e) { L.seriesErr = e.message; }
  L.seriesLoading = false; labRender();
  return L.series;
}
function seriesVal(name, row, i) {        // decoded value or NaN
  const a = L.series[name], m = a.meta, v = a[row * S.n + i];
  return v === m.fill ? NaN : v * m.scale;
}

    normalization_ranges: S.ranges, min_coverage: ENG.MIN_COVERAGE, distinct_sep_km: A.thresholds.distinct_sep_km,
    predictor_stack: { sha256: A.stack.sha256, file_hashes: A.file_hashes },

function baseKey() { return LAB.canonical({ t: S.targetId, w: S.critIds.map(c => +S.weights[c]) }); }
function targetsFor(tid) { return tid === "cross" ? TARGET_IDS : [tid]; }
const prepCache = new Map();
function prepFor(tid) {                      // per-criterion similarity arrays, cached per target
  if (!prepCache.has(tid)) prepCache.set(tid, LAB.prepare(S.A, S.critIds, S.T[tid].variables, S.ranges));

  const set = new Set(); for (const t of targetsFor(tid)) for (const c of S.critIds) if (S.T[t].variables[c] != null && +w[c] > 0) set.add(c);
  return S.critIds.filter(c => set.has(c));
}
function coverageOf(tid, i, w = S.weights) {
  return Math.min(...targetsFor(tid).map(t => { const a = S.critIds.filter(c => S.T[t].variables[c] != null && +w[c] > 0); let tot = 0, ok = 0; for (const c of a) { tot += +w[c]; if (S.A[c][i] === S.A[c][i]) ok += +w[c]; } return tot ? ok / tot : 0; }));
}

const VAULT_KEY = "asterro.phase2.vault.v1";

async function makeRecord(module, params, outputs, extra = {}) {
  const config = { schema: "asterro.experiment/1", module, baseline: labBaseline(), params };
  const id = (await LAB.sha256Hex(LAB.canonical(config))).slice(0, 16);
  const outputs_sha256 = await LAB.sha256Hex(LAB.canonical(outputs));
  const rec = { ...config, id, created_utc: new Date().toISOString(), outputs, outputs_sha256,
    limitations: extra.limitations || [], claims: extra.claims || [], parent: extra.parent || null,
    replay: extra.replay || "browser", software: { app: S.app.algorithm_version, phase2: LAB.VERSION } };
  L.records = L.records.filter(r => r.id !== id); L.records.push(rec); vaultSave();

}

/* ===== Phase II · Analogue Robustness Laboratory ===== */
L.robustCfg = { design: "factorial", samples: 300, seed: 20261013, logRange: 1, topPct: 1, topN: 20, stableFrac: 0.95, moderateFrac: 0.5 };

function busyUpdate() {
  const b = $(".lab-busy"); if (!b || !L.busy) { labRender(); return; }
  b.querySelector(".fill").style.width = (100 * L.busy.done / L.busy.total).toFixed(1) + "%";
  b.querySelector(".meta").textContent = `${L.busy.label} · ${L.busy.done}/${L.busy.total}`;
}
function buildDesign(cfg, baseW, act) {
  if (cfg.design === "oat") return { name: "One-at-a-time ×½ / ×2", design: LAB.designOAT(baseW, act, S.critIds, [0.5, 2]),
    description: `Each active criterion's weight multiplied by 0.5 and by 2, one at a time (${act.length * 2} configurations).` };
  if (cfg.design === "factorial") return { name: "Full factorial ×{½, 1, 2}", design: LAB.designFactorial(baseW, act, S.critIds, [0.5, 1, 2]),
    description: `Every combination of the multipliers 0.5, 1 and 2 on the ${act.length} active weights (3^${act.length} = ${Math.pow(3, act.length)} configurations, deterministic enumeration; includes the baseline).` };
  return { name: `Seeded sample n = ${cfg.samples}`, design: LAB.designSampled(baseW, act, S.critIds, cfg.samples, cfg.seed, cfg.logRange),
    description: `${cfg.samples} configurations; each active weight multiplied by 2^u, u ~ Uniform(−${cfg.logRange}, ${cfg.logRange}) independently (mulberry32, seed ${cfg.seed}). A sample frequency is not a real-world probability.` };
}

/* Pure computation (also used by the Vault replay). */
async function robustCompute(tid, baseW, cand, cfg, onProgress) {
  const act = activeFor(tid, baseW), Ps = PsFor(tid), D = buildDesign(cfg, baseW, act), oat = LAB.designOAT(baseW, act, S.critIds, [0.5, 2]);
  const total = D.design.length + oat.length;
  const run = await LAB.runDesign({ Ps, cell: S.cell, cand, baseW, design: D.design, onProgress: d => onProgress ? onProgress(d, total) : true });
  if (run.cancelled) return null;
  const orun = await LAB.runDesign({ Ps, cell: S.cell, cand, baseW, design: oat, onProgress: d => onProgress ? onProgress(D.design.length + d, total) : true });
  if (orun.cancelled) return null;
  const cov = cand.map(i => coverageOf(tid, i, baseW));
  const st = LAB.rankStats(run, { topPct: cfg.topPct, topN: cfg.topN, stableFrac: cfg.stableFrac, moderateFrac: cfg.moderateFrac, coverage: cov });
  const sens = LAB.oatSensitivity(orun, oat), flips = LAB.pairFlips(run);
  const outputs = { cells: cand.map(i => S.cell[i]), stats: st.map(x => ({ ...x })), drivers: sens.map(x => x.driver),
    oat: sens.map(x => x.list.map(e => ({ c: e.criterion, r: e.ranks, m: e.maxAbsLog2 }))), nConfigs: D.design.length };
  return { act, D, oat, run, orun, st, sens, flips, outputs, total };
}
function robustValidate(cfg) {
  LAB.inBounds("topPct", cfg.topPct); LAB.inBounds("topN", cfg.topN); LAB.inBounds("stableFrac", cfg.stableFrac); LAB.inBounds("moderateFrac", cfg.moderateFrac);
  if (cfg.design === "sampled") { LAB.inBounds("samples", cfg.samples); LAB.inBounds("logRange", cfg.logRange); if (!Number.isInteger(cfg.seed) || cfg.seed < 0) throw new Error("seed must be a non-negative integer"); }
  if (cfg.moderateFrac >= cfg.stableFrac) throw new Error("moderate threshold must be below the stable threshold");
  if (!["oat", "factorial", "sampled"].includes(cfg.design)) throw new Error("unknown design " + cfg.design);
}
async function runRobustness() {
  if (L.busy) return;
  const cfg = { ...L.robustCfg };
  try { robustValidate(cfg); } catch (e) { L.res.robustErr = e.message; labRender(); return; }
  L.res.robustErr = null;
  const tid = S.targetId, baseW = { ...S.weights }, cand = candSet();
  const sel = labSel(); if (sel != null && !cand.includes(sel)) cand.push(sel);
  const t0 = performance.now();
  L.busy = { label: "Robustness experiment", done: 0, total: 1, cancel: false }; labRender();
  const X = await robustCompute(tid, baseW, cand, cfg, (d, tot) => { L.busy.done = d; L.busy.total = tot; busyUpdate(); return !L.busy.cancel; });
  const ms = performance.now() - t0; L.busy = null;
  if (!X) { L.res.robustErr = "Cancelled — no partial result is reported."; labRender(); return; }
  const { act, D, oat, run, orun, st, sens, flips, outputs } = X;
  const claims = [
    LAB.claim({ id: "robust.stability", category: "DERIVED", text: `Rank statistics of ${cand.length} candidates across ${D.design.length} weight configurations (${D.name}).`,
      method: "Each configuration re-scores all " + S.n.toLocaleString() + " cells with the baseline formula; candidate ranks are exact (score desc, cell id asc).",
      provenance: ["predictor stack " + S.app.stack.sha256.slice(0, 12) + "…", "targets.json"], assumptions: [D.description],
      limitations: ["Robust under the TESTED weight space only; other methodological choices (normalisation, criteria set, targets) are not varied.", "Robustness is not scientific validation."] }),
    LAB.claim({ id: "robust.classification", category: "INFERRED", text: `Classification: stable if within the top ${cfg.topPct}% of eligible cells in ≥ ${pct(cfg.stableFrac)} of configurations; moderately sensitive if ≥ ${pct(cfg.moderateFrac)}; otherwise highly sensitive; insufficient evidence if < 10 configurations or weight coverage < 100 %.`,
      method: "Threshold rule on the fraction of configurations (user-adjustable within documented bounds).", completeness: "complete" }),
    LAB.claim({ id: "robust.validation", category: "UNVALIDATED", text: "No candidate's analogue value has been validated against field studies or expert-selected analogue sites.", completeness: "partial" }),
  ];
  const rec = await makeRecord("robustness", { design: cfg.design, samples: cfg.samples, seed: cfg.seed, logRange: cfg.logRange, topPct: cfg.topPct, topN: cfg.topN,
    stableFrac: cfg.stableFrac, moderateFrac: cfg.moderateFrac, candidates: cand.map(i => S.cell[i]) }, outputs,
    { claims, limitations: claims[0].limitations, replay: "browser + python (scripts/replay_experiment.py)" });
  L.res.robust = { key: baseKey(), tid, cand, st, sens, flips, run, D, cfg, ms, act, claims, rec, oat, orun };
  labRender();
}

function ablationCompute(tid, baseW) {
  const act = activeFor(tid, baseW);

L.mo = { pool: 800, k: 10, objectives: null, ax: null, ay: null, delta: 0.05 };

function moObjectives() {
  const act = activeFor(S.targetId);
  if (!L.mo.objectives || L.mo.objectives.some(c => !act.includes(c))) L.mo.objectives = act.slice();
  if (!L.mo.ax || !act.includes(L.mo.ax)) L.mo.ax = act[0];
  if (!L.mo.ay || !act.includes(L.mo.ay) || L.mo.ay === L.mo.ax) L.mo.ay = act.find(c => c !== L.mo.ax);
  return act;
}
/* per-criterion similarity for the current target; cross mode uses the MIN of the two targets'
 * similarities only for criteria applicable to both (documented; never a new unified score). */
function simC(c, i) {
  if (S.targetId !== "cross") { const v = prepFor(S.targetId).s[c]; return v ? v[i] : NaN; }
  const a = prepFor(TARGET_IDS[0]).s[c], b = prepFor(TARGET_IDS[1]).s[c];
  if (!a || !b) return NaN; return Math.min(a[i], b[i]);
}
function runPortfolio() {
  const act = moObjectives(), obj = L.mo.objectives, R = S.res;
  if (obj.length < 2) { L.res.mo = { err: "Choose at least two objectives." }; labRender(); return; }
  const n = Math.max(50, Math.min(3000, Math.round(L.mo.pool))), k = Math.max(3, Math.min(20, Math.round(L.mo.k)));
  const pool = Array.from(R.order.slice(0, Math.min(n, R.nElig)));
  const t0 = performance.now();
  const P = LAB.pareto(pool.map(i => ({ id: i, v: obj.map(c => simC(c, i)) })));
  const sep = S.app.thresholds.distinct_sep_km;
  const setA = R.distinct.slice(0, k);
  const minScore = R.eff[setA[setA.length - 1]];
  const setB = LAB.diversePortfolio({ pool, k, A: S.A, crits: obj, ranges: S.ranges, lat: S.lat, lon: S.lon, eff: R.eff, minScore, sep });
  const frontSorted = P.front.slice().sort((x, y) => R.eff[y] - R.eff[x] || S.cell[x] - S.cell[y]);
  const setC = []; for (const i of frontSorted) { if (setC.length >= k) break; if (setC.every(j => LAB.haversine(S.lat[i], S.lon[i], S.lat[j], S.lon[j]) >= sep)) setC.push(i); }
  const robustSt = L.res.robust && L.res.robust.key === baseKey() ? L.res.robust : null;
  const robFor = set => robustSt ? set.map(i => { const q = robustSt.cand.indexOf(i); return q >= 0 ? robustSt.st[q] : null; }).filter(Boolean) : null;
  const metrics = { A: setA, B: setB, C: setC };
  const M = Object.fromEntries(Object.entries(metrics).map(([key, set]) => [key, LAB.portfolioMetrics({ set, A: S.A, crits: obj, ranges: S.ranges, lat: S.lat, lon: S.lon, eff: R.eff, pool, redundancyDelta: L.mo.delta, robust: (() => { const r = robFor(set); return r && r.length === set.length ? r : null; })() })]));
  const why = setB.map((i, q) => {
    if (q === 0) return { i, text: "Start: highest-scoring cell of the pool." };
    const prev = setB.slice(0, q), V = LAB.normVec(S.A, i, obj, S.ranges);
    const d = Math.min(...prev.map(j => LAB.envDist(V, LAB.normVec(S.A, j, obj, S.ranges))));
    return { i, text: `Farthest remaining pool cell in normalised criterion space from those already chosen (nearest chosen at RMS distance ${d.toFixed(3)}), ≥ ${sep} km from all of them; score ${fmtPct(R.eff[i])} vs set-A mean ${fmtPct(M.A.meanScore)}.` };
  });

    LAB.claim({ id: "mo.pareto", category: "DERIVED", text: `${P.front.length} of ${P.evaluated} pool cells are non-dominated on {${obj.map(shortOf).join(", ")}}; ${P.notEvaluable.length} cells lack a value on at least one objective and were not evaluated.`,
      method: "a dominates b iff s_c(a) ≥ s_c(b) for every selected criterion and > for at least one (maximisation of criterion similarity).", provenance: ["predictor stack", "targets.json"],
      limitations: ["Pareto-optimal means 'not dominated', i.e. a different trade-off — not universally better.", S.targetId === "cross" ? "Cross mode: per-criterion similarity = min over the two targets for criteria defined for both." : "Pool = top " + n + " eligible cells by baseline score."] }),
    LAB.claim({ id: "mo.diverse", category: "INFERRED", text: "Set B is a greedy max–min diversity heuristic; it is not claimed to be globally optimal.",
      method: "Farthest-point selection in range-normalised criterion space (RMS over selected criteria), restricted to score ≥ the k-th baseline distinct site and ≥ distinct-site separation.", completeness: "complete" }),
  ];
  L.res.mo = { key: baseKey(), obj, pool, P, sets: metrics, M, why, ms, claims, k, n };
  makeRecord("multi_objective", { objectives: obj, pool: n, k, delta: L.mo.delta }, { front: P.front.map(i => S.cell[i]), A: setA.map(i => S.cell[i]), B: setB.map(i => S.cell[i]), C: setC.map(i => S.cell[i]) }, { claims })
    .then(r => { L.res.mo.rec = r; labRender(); });
  labRender();
}
function paretoSVG(Rm) {
  const W = 700, H = 360, m = { l: 44, r: 12, t: 12, b: 34 }, ax = L.mo.ax, ay = L.mo.ay;
  const pts = Rm.pool.map(i => [simC(ax, i), simC(ay, i), i]).filter(p => p[0] === p[0] && p[1] === p[1]);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const xlo = Math.min(...xs), xhi = Math.max(...xs), ylo = Math.min(...ys), yhi = Math.max(...ys);
  const X = v => m.l + (v - xlo) / ((xhi - xlo) || 1) * (W - m.l - m.r), Y = v => H - m.b - (v - ylo) / ((yhi - ylo) || 1) * (H - m.t - m.b);
  const fr = new Set(Rm.P.front);
  let g = `<rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="none" stroke="var(--line)"/>`;
  for (const p of pts) if (!fr.has(p[2])) g += `<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="2" fill="var(--ink-3)" opacity=".45"/>`;
  for (const p of pts) if (fr.has(p[2])) g += `<g class="hov" data-lab="sel" data-i="${p[2]}"><circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="9" fill="transparent"/><circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--ground)" stroke-width="2"><title>${esc(candShort(p[2]))} · ${shortOf(ax)} ${p[0].toFixed(3)} · ${shortOf(ay)} ${p[1].toFixed(3)} · score ${fmtPct(S.res.eff[p[2]])}</title></circle></g>`;
  const tick = (lo, hi) => [0, 0.5, 1].map(f => lo + f * (hi - lo));
  g += tick(xlo, xhi).map(v => `<text x="${X(v)}" y="${H - m.b + 14}" font-size="9" text-anchor="middle" fill="var(--ink-3)">${v.toFixed(2)}</text>`).join("");
  g += tick(ylo, yhi).map(v => `<text x="${m.l - 6}" y="${Y(v) + 3}" font-size="9" text-anchor="end" fill="var(--ink-3)">${v.toFixed(2)}</text>`).join("");
  g += `<text x="${(m.l + W - m.r) / 2}" y="${H - 6}" font-size="10" text-anchor="middle" fill="var(--ink-2)">similarity on ${esc(labelOf(ax))} (s, 0–1)</text>`;
  g += `<text transform="translate(11 ${(m.t + H - m.b) / 2}) rotate(-90)" font-size="10" text-anchor="middle" fill="var(--ink-2)">similarity on ${esc(labelOf(ay))} (s)</text>`;
  return `<svg class="fp-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pool cells by two criterion similarities; non-dominated cells highlighted">${g}</svg>`;
}

function lossRows(i, tid, w) {
  const d = ENG.detail(S.A, S.critIds, i, S.T[tid].variables, w, S.ranges);
  return d.rows.filter(r => r.active).map(r => ({ c: r.c, e: r.e, t: r.t, s: r.s, d: r.d, w: r.w,
    loss: r.s == null ? null : 100 * r.w * (1 - r.s) / d.wsum, missing: r.s == null })).sort((a, b) => (b.loss ?? -1) - (a.loss ?? -1));
}
function topPctLimit(eff, p) { return Math.max(1, Math.floor(LAB.countEligible(eff) * p / 100)); }
function rankArray(eff) { return ENG.ranksFromOrder(ENG.order(eff, S.cell)); }

function runCounterexamples() {
  const tid = S.targetId, R = S.res, w = { ...S.weights }, act = activeFor(tid, w);
  const t0 = performance.now(), pool = Array.from(R.order.slice(0, 800));
  const sc = (c, i) => simC(c, i);
  const a = pool.map(i => ({ i, min: Math.min(...act.map(c => { const v = sc(c, i); return v === v ? v : Infinity; })), worst: act.reduce((b, c) => { const v = sc(c, i); return v === v && (b == null || v < sc(b, i)) ? c : b; }, null) }))
    .filter(x => x.min < L.fm.tau).sort((x, y) => R.eff[y.i] - R.eff[x.i]);
  const sc_c = L.fm.strongCrit && act.includes(L.fm.strongCrit) ? L.fm.strongCrit : act[0], hiLim = Math.floor(R.nElig * 0.10);
  const b = []; for (let k = 800; k < hiLim; k++) { const i = R.order[k], v = sc(sc_c, i); if (v >= L.fm.strong) b.push({ i, v, rank: k + 1 }); }
  b.sort((x, y) => y.v - x.v || x.rank - y.rank);
  // profile flips
  const Ps = PsFor(tid), prof = Object.entries(S.app.profiles), ranks = {};
  for (const [pid, p] of prof) { try { ranks[pid] = rankArray(LAB.effFor(Ps, p.weights)); } catch (e) { ranks[pid] = null; } }
  const n1 = Math.floor(R.nElig * 0.01), n10 = Math.floor(R.nElig * 0.10), flips = [];
  for (const [p1] of prof) for (const [p2] of prof) {
    if (p1 === p2 || !ranks[p1] || !ranks[p2]) continue;
    let cnt = 0, ex = null;
    for (let i = 0; i < S.n; i++) if (ranks[p1][i] <= n1 && ranks[p2][i] > n10) { cnt++; if (ex == null || ranks[p1][i] < ranks[p1][ex]) ex = i; }
    if (cnt) flips.push({ p1, p2, cnt, ex });
  }
  flips.sort((x, y) => y.cnt - x.cnt);
  // proxy dependence
  const prox = act.filter(c => targetsFor(tid).some(t => S.T[t].proxy_flags[c]));
  let pd = null;

    const w2 = { ...w }; for (const c of prox) w2[c] = 0;
    const r2 = rankArray(LAB.effFor(Ps, w2)), lim1 = topPctLimit(R.eff, 1), lim10 = topPctLimit(R.eff, 10), list = [];
    for (let i = 0; i < S.n; i++) if (R.rank[i] <= lim1 && r2[i] > lim10) list.push({ i, r0: R.rank[i], r1: r2[i] });
    list.sort((x, y) => x.r0 - y.r0);

}

async function verifyRecord(r) {
  const issues = [], ok = [];
  const cfg = { schema: r.schema, module: r.module, baseline: r.baseline, params: r.params };
  const id = (await LAB.sha256Hex(LAB.canonical(cfg))).slice(0, 16);
  (id === r.id ? ok : issues).push(id === r.id ? "Configuration hash matches record id." : `Configuration hash ${id} ≠ record id ${r.id} (record edited or corrupted).`);
  const oh = await LAB.sha256Hex(LAB.canonical(r.outputs));
  (oh === r.outputs_sha256 ? ok : issues).push(oh === r.outputs_sha256 ? "Stored outputs match their checksum." : "Stored outputs do not match their checksum.");
  const b = r.baseline || {};
  if (b.predictor_stack && b.predictor_stack.sha256 !== S.app.stack.sha256) issues.push(`Missing dependency: record needs predictor stack ${b.predictor_stack.sha256.slice(0, 12)}…; this app has ${S.app.stack.sha256.slice(0, 12)}…. Replay impossible here.`);
  else ok.push("Predictor stack available (SHA-256 matches).");
  if (b.algorithm_version !== S.app.algorithm_version) issues.push(`Algorithm version ${b.algorithm_version} ≠ ${S.app.algorithm_version}.`); else ok.push("Algorithm version matches.");
  if (b.phase2_version !== LAB.VERSION) issues.push(`Phase II version ${b.phase2_version} ≠ ${LAB.VERSION}; results may differ.`); else ok.push("Phase II version matches.");
  if (!REPLAYABLE[r.module]) issues.push(`Deterministic replay is not implemented for module “${r.module}”; re-run the module with the recorded parameters instead.`);
  return { ok, issues };
}
async function replayRecord(r) {
  const b = r.baseline;
  if (b.predictor_stack.sha256 !== S.app.stack.sha256) return { status: "BLOCKED", text: "Required predictor stack not available." };
  const toIdx = cells => cells.map(c => S.index[c]);
  let out;
  if (r.module === "robustness") {
    const cand = toIdx(r.params.candidates); if (cand.some(i => i < 0)) return { status: "BLOCKED", text: "A candidate cell is not in this stack." };
    L.busy = { label: "Replaying " + r.id, done: 0, total: 1, cancel: false }; labRender();
    const X = await robustCompute(b.target, b.weights, cand, r.params, (d, t) => { L.busy.done = d; L.busy.total = t; busyUpdate(); return !L.busy.cancel; });
    L.busy = null; if (!X) return { status: "CANCELLED", text: "Replay cancelled." };
    out = X.outputs;
  } else if (r.module === "ablation") out = ablationCompute(b.target, b.weights).outputs;
  else if (r.module === "requirements") {
    if (!L.ctx) await labCtx(); const reg = registry(), ctx = reqCtx(), cand = toIdx(r.params.candidates);
    out = { matrix: cand.map((i, k) => { const row = r.params.requirements.map(q => LAB.evaluateRequirement(q, i, reg, ctx)); return { cell: r.params.candidates[k], status: row.map(x => x.status), values: row.map(x => x.value) }; }) };
  } else return { status: "UNSUPPORTED", text: "Replay not implemented for this module." };
  const h = await LAB.sha256Hex(LAB.canonical(out));
  return h === r.outputs_sha256 ? { status: "REPRODUCED", text: "Replay reproduced the stored outputs exactly (SHA-256 " + h.slice(0, 16) + "…)." }
    : { status: "DIFFERS", text: "Replay outputs differ from the record (" + h.slice(0, 12) + "… vs " + r.outputs_sha256.slice(0, 12) + "…)." };
}
function diffObj(a, b, path = "", out = []) {
  if (LAB.canonical(a) === LAB.canonical(b)) return out;
  if (a && b && typeof a === "object" && typeof b === "object" && !Array.isArray(a) && !Array.isArray(b)) {
    for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) diffObj(a[k], b[k], path ? path + "." + k : k, out);
  } else out.push({ path, a: LAB.canonical(a), b: LAB.canonical(b) });
  return out;
}

    contains: "configuration, metadata, outputs and checksums only — no source data, no credentials" } }, null, 1);
}

/* Earth map: Blue Marble (context) + optional score field + labelled candidates.

function atEarthMap(id, items, { w = 720, h = 360, field = null } = {}) {

  const mk = items.map(o => `<g class="emk ${o.cls || ""}" data-a3="cand" data-i="${o.i}" data-t="${o.t || ""}" tabindex="0" role="button" aria-label="${esc(o.title || placeStr(o.i))}"><circle cx="${X(S.lon[o.i]).toFixed(1)}" cy="${Y(S.lat[o.i]).toFixed(1)}" r="${String(o.label).length > 2 ? 8 : 6.5}"/><text x="${X(S.lon[o.i]).toFixed(1)}" y="${(Y(S.lat[o.i]) + 3).toFixed(1)}" text-anchor="middle">${esc(o.label)}</text><title>${esc(o.title || placeStr(o.i))}</title></g>`).join("");

function atDrawField(id, eff, w, h) {
  const img = document.getElementById(id + "-field"); if (!img) return;
  const c = document.createElement("canvas"); c.width = 576; c.height = 361;
  const g = c.getContext("2d"), D = g.createImageData(576, 361);
  const rgb = getComputedStyle($("#app")).getPropertyValue("--accent").trim() || "#E0874F";
  const hx = rgb.replace("#", ""), R = parseInt(hx.slice(0, 2), 16), G = parseInt(hx.slice(2, 4), 16), B = parseInt(hx.slice(4, 6), 16);
  for (let i = 0; i < eff.length; i++) {
    const v = eff[i]; if (!(v >= 0)) continue;
    const cl = S.cell[i], row = 360 - Math.floor(cl / 576), col = cl % 576, p = (row * 576 + col) * 4;
    D.data[p] = R; D.data[p + 1] = G; D.data[p + 2] = B; D.data[p + 3] = Math.round(255 * Math.pow(v, 3) * 0.9);
  }

}
/* 60x60 window rasters (terrain hillshade / slope / thermal) drawn after render */
function atRaster(id, arr, kind, px = 3) {
  A3.draw.push(() => {
    const c = document.getElementById(id); if (!c || !arr) return;
    const g = c.getContext("2d"), D = g.createImageData(60, 60), b = ATL.BIN_M;
    let lo = Infinity, hi = -Infinity;
    for (const v of arr) if (v === v) { if (v < lo) lo = v; if (v > hi) hi = v; }
    for (let r = 0; r < 60; r++) for (let q = 0; q < 60; q++) {
      const k = r * 60 + q, v = arr[k], p = k * 4;
      if (v !== v) { D.data[p] = 40; D.data[p + 1] = 20; D.data[p + 2] = 20; D.data[p + 3] = 255; continue; }
      let s;
      if (kind === "hill") {
        const zl = arr[r * 60 + Math.max(0, q - 1)], zr = arr[r * 60 + Math.min(59, q + 1)], zu = arr[Math.max(0, r - 1) * 60 + q], zd = arr[Math.min(59, r + 1) * 60 + q];
        const dzdx = ((zr === zr ? zr : v) - (zl === zl ? zl : v)) / (2 * b), dzdy = ((zu === zu ? zu : v) - (zd === zd ? zd : v)) / (2 * b);
        const sl = Math.atan(Math.hypot(dzdx, dzdy)), as = Math.atan2(dzdy, -dzdx), z = Math.PI / 4, az = 5.497787;
        s = Math.max(0, Math.cos(z) * Math.cos(sl) + Math.sin(z) * Math.sin(sl) * Math.cos(az - as));
        const tint = hi > lo ? (v - lo) / (hi - lo) : 0.5; s = 0.75 * s + 0.25 * tint;
        D.data[p] = D.data[p + 1] = D.data[p + 2] = Math.round(255 * s);
      } else {
        s = kind === "slope" ? Math.min(1, v / 30) : (hi > lo ? (v - lo) / (hi - lo) : 0.5);
        const ramp = kind === "slope" ? [[22, 30, 36], [216, 180, 91], [217, 112, 95]] : [[30, 40, 70], [127, 179, 174], [230, 233, 236]];
        const [a0, a1, a2] = ramp, m = s < 0.5 ? [a0, a1, s * 2] : [a1, a2, (s - 0.5) * 2];
        for (let j = 0; j < 3; j++) D.data[p + j] = Math.round(m[0][j] + (m[1][j] - m[0][j]) * m[2]);
      }
      D.data[p + 3] = 255;
    }
    const t = document.createElement("canvas"); t.width = 60; t.height = 60; t.getContext("2d").putImageData(D, 0, 0);
    g.imageSmoothingEnabled = false; g.drawImage(t, 0, 0, 60 * px, 60 * px);
  });
  return `<canvas id="${id}" width="${60 * px}" height="${60 * px}" class="at-raster" role="img" aria-label="${esc(kind)} map of the 55.6 km window"></canvas>`;
}

function atThermalBlock(t) {

      </tbody></table></div><p class="note small">Fingerprint value = mean of the two seasonal window means. The two seasons differ by ${f1(Math.abs(th.seasons.summer.mean_dT_K - th.seasons.winter.mean_dT_K))} K — a measured, not modelled, indication of seasonal sensitivity. Bins are 240 m; the map shows them averaged to 926.6 m.</p></div>`;

      if (!sc.length) { res.push({ criterion: c, blocked: `No other ${t.body} target has a measured ${labelOf(c)}; no scenario can be formed.` }); continue; }
      res.push(ATL.measurementImpact({ A: S.A, cell: S.cell, lat: S.lat, lon: S.lon, critIds: S.critIds, t, ranges: atRanges(t), w, criterion: c, scenarios: sc }));

}
