const A3_VAULT = "asterro.phase3.vault.v2";
function atVaultLoad() { try { const s = localStorage.getItem(A3_VAULT); A3.records = s ? JSON.parse(s) : []; } catch (e) { A3.records = []; } }
function atVaultSave() { try { localStorage.setItem(A3_VAULT, JSON.stringify(A3.records.slice(-80))); return true; } catch (e) { return false; } }
atVaultLoad();
function atContext(targets, stage) {
  return { kind: "atlas", targets, workflow_stage: stage || null,
    atlas: { version: A3.atlas.version, schema: A3.atlas.schema, built_utc: A3.atlas.built_utc },
    normalisation: { kind: A3.norm, id: A3.norm === "atlas" ? A3.atlas.normalisation.id : A3.norm,
      ranges: Object.fromEntries(targets.map(id => [id, atRanges(atT(id))])) },
    profile: A3.profile, weights: atWeights(), include_proxy: A3.includeProxy,
    target_vectors: Object.fromEntries(targets.map(id => [id, ATL.targetVector(atT(id), S.critIds, { includeProxy: A3.includeProxy })])),
    predictor_stack: { sha256: S.app.stack.sha256 }, algorithm_version: S.app.algorithm_version,
    min_coverage: S.app.thresholds.min_coverage, distinct_sep_km: S.app.thresholds.distinct_sep_km };
}
async function atMakeRecord(module, params, outputs, { targets, stage, claims = [], limitations = [], parents = [] } = {}) {
  const r0 = { schema: ATL.CONTRACT, contract: "2.0.0", module, context: atContext(targets, stage), params };
  const id = (await LAB.sha256Hex(LAB.canonical(ATL.recordConfigV2(r0)))).slice(0, 16);
  const rec = { ...r0, id, created_utc: new Date().toISOString(), outputs, outputs_sha256: await LAB.sha256Hex(LAB.canonical(outputs)),
    claims, limitations, parents, replay: ["atlas-candidates", "atlas-stability"].includes(module) ? "browser + python (scripts/replay_atlas_record.py)" : "browser",
    software: { app: S.app.algorithm_version, phase2: LAB.VERSION, phase3: ATL.VERSION } };
  const issues = ATL.validateV2(rec); if (issues.length) throw new Error("record invalid: " + issues.join("; "));
  A3.records = A3.records.filter(r => r.id !== id); A3.records.push(rec); atVaultSave();
  return rec;
}
function atCandOutputs(t, n) {
  const r = ATL.candidates({ A: S.A, cell: S.cell, lat: S.lat, lon: S.lon, critIds: S.critIds, t: { ...t, values: { ...t.values } }, ranges: atRanges(t), w: atWeights(), n, includeProxy: A3.includeProxy });
  return { target: t.id, eligible: r.eligible, mode: r.mode, cells: r.eligible ? r.top.map(i => S.cell[i]) : [], scores: r.eligible ? r.top.map(i => r.eff[i]) : [] };
}
async function atReplay(r) {
  if (r.context.predictor_stack.sha256 !== S.app.stack.sha256) return { status: "BLOCKED", text: "Required predictor stack not available." };
  const saved = { profile: A3.profile, norm: A3.norm, proxy: A3.includeProxy };
  let out;
  try {
    A3.profile = r.context.profile; A3.norm = r.context.normalisation.kind; A3.includeProxy = r.context.include_proxy;
    const W = r.context.weights, same = Object.keys(W).every(c => +W[c] === +atWeights()[c]);
    if (!same) return { status: "BLOCKED", text: "The recorded profile weights differ from this build's profile table." };
    for (const id of r.context.targets) {
      const tv = ATL.targetVector(atT(id), S.critIds, { includeProxy: A3.includeProxy });
      if (LAB.canonical(tv) !== LAB.canonical(r.context.target_vectors[id])) return { status: "DIFFERS", text: `Target ${id} has a different fingerprint in this atlas build (${A3.atlas.version}).` };
    }
    if (r.module === "atlas-candidates") out = { candidates: r.context.targets.map(id => atCandOutputs(atT(id), r.params.n)) };
    else if (r.module === "atlas-stability") {
      const t = atT(r.context.targets[0]), P = ATL.prepareTarget(S.A, S.critIds, t, atRanges(t), { includeProxy: A3.includeProxy }), w = atWeights();
      const cand = r.params.candidates.map(c => S.index[c]); if (cand.some(i => i < 0)) return { status: "BLOCKED", text: "A candidate cell is not in this stack." };
      const design = LAB.designFactorial(w, r.params.active, S.critIds, r.params.factors);
      const run = LAB.runDesignSync({ Ps: [P], cell: S.cell, cand, baseW: w, design });
      out = { stats: LAB.rankStats(run, { topN: 20, topPct: 1 }).map(s => ({ baseline: s.baseline, min: s.min, max: s.max, median: s.median, cls: s.cls })) };
    } else return { status: "UNSUPPORTED", text: "Replay not implemented for module " + r.module + "." };
  } finally { A3.profile = saved.profile; A3.norm = saved.norm; A3.includeProxy = saved.proxy; }
  const h = await LAB.sha256Hex(LAB.canonical(out));
  return h === r.outputs_sha256 ? { status: "REPRODUCED", text: "Replay reproduced the stored outputs exactly (SHA-256 " + h.slice(0, 16) + "…)." }
    : { status: "DIFFERS", text: "Replay outputs differ (" + h.slice(0, 12) + "… vs " + r.outputs_sha256.slice(0, 12) + "…)." };
}

/* ===== Phase III · Mismatch Cartographer =====
 * Where on Earth, and on which criterion, does a target fail to be matched — and where is the
 * question unanswerable because data are missing? Ordinary environmental differences are drawn
 * on a continuous colour ramp; missing Earth data are drawn as a hatched pattern; a criterion the
 * target lacks is not drawn at all. A missing value is never shown as a match. */
A3.mm = { crit: null };
function atMmDraw(id, t, c, ranges) {
  A3.draw.push(() => {
    const img = document.getElementById(id + "-field"); if (!img) return;
    const cv = document.createElement("canvas"); cv.width = 576; cv.height = 361;
    const g = cv.getContext("2d"), D = g.createImageData(576, 361), tv = +t.values[c], span = ranges[c][1] - ranges[c][0];
    for (let i = 0; i < S.n; i++) {
      const cl = S.cell[i], row = 360 - Math.floor(cl / 576), col = cl % 576, p = (row * 576 + col) * 4, e = S.A[c][i];
      if (e - e !== 0) {                                     // missing Earth value: hatch (distinct from any difference)
        const on = (row + col) % 3 === 0; D.data[p] = on ? 200 : 60; D.data[p + 1] = on ? 120 : 40; D.data[p + 2] = on ? 220 : 70; D.data[p + 3] = 220; continue;
      }
      const s = Math.max(0, 1 - Math.abs(e - tv) / span);    // criterion similarity (baseline formula)
      const lo = [217, 112, 95], mid = [216, 180, 91], hi = [140, 192, 143];
      const [a, b, f] = s < 0.6 ? [lo, mid, s / 0.6] : [mid, hi, (s - 0.6) / 0.4];
      for (let j = 0; j < 3; j++) D.data[p + j] = Math.round(a[j] + (b[j] - a[j]) * f);
      D.data[p + 3] = 200;
    }

}
A3_VIEWS.mismatch = function () {
  const t = atT(A3.active); if (!t) return `<div class="sec"><div class="empty">Choose a target.</div></div>`;
  const direct = S.critIds.filter(c => t.status[c] === "DIRECT");
  const c = direct.includes(A3.mm.crit) ? A3.mm.crit : direct[0];
  const R = atCands(t, 20), ranges = atRanges(t);
  let h = `<div class="sec"><h3 class="ttl">Mismatch cartographer</h3>${atBanner("diagnostic map")}
    <div class="lab-form"><label class="wide">Target${atTargetPicker(t.id)}</label>
    <label>Criterion<select data-a3in="mm-c">${S.critIds.map(x => `<option value="${x}" ${x === c ? "selected" : ""} ${t.status[x] === "DIRECT" ? "" : "disabled"}>${esc(labelOf(x))}${t.status[x] === "DIRECT" ? "" : " — " + t.status[x]}</option>`).join("")}</select></label></div>`;
  if (!c) return h + `<div class="callout warn">No directly comparable criterion: nothing can be mapped.</div></div>`;

  for (let i = 0; i < S.n; i++) { const e = S.A[c][i]; if (e - e !== 0) { nMiss++; continue; } const s = Math.max(0, 1 - Math.abs(e - t.values[c]) / span); if (s >= 0.85) nMatch++; else if (s >= 0.6) nPart++; else nMis++; }

  h += `<p class="note small">Colour = criterion similarity s to ${esc(t.name)} on ${esc(labelOf(c))} (${atVal(c, t.values[c])}): red s &lt; 0.60 (mismatch) → amber → green s ≥ 0.85 (match), the baseline thresholds. <b>Hatched violet = no Earth value</b> (a data gap, not a difference).</p></div>
    <div class="sec">${atEarthMap("at-mm", R.eligible ? R.top.slice(0, 10).map((i, k) => ({ i, label: k + 1, title: placeStr(i) })) : [])}
    <div class="grid2"><div class="kv"><span>match (s ≥ 0.85)</span><b>${nfmt(nMatch)} cells</b></div><div class="kv"><span>partial (0.60–0.85)</span><b>${nfmt(nPart)}</b></div>
    <div class="kv"><span>mismatch (s &lt; 0.60)</span><b>${nfmt(nMis)}</b></div><div class="kv"><span>no Earth value (data gap)</span><b>${nfmt(nMiss)}</b></div></div></div>`;
  // candidate-level mismatch profile with data-quality warnings kept separate
  if (R.eligible) {
    const w = atWeights();

      ${R.top.slice(0, 10).map((i, k) => { const X = ATL.explain(R.P, w, i, S.A, R.ranges), byC = Object.fromEntries(X.map(x => [x.criterion, x]));
        const warn = []; if (S.A.modis_coverage[i] < 0.9) warn.push(`MODIS coverage ${pct(S.A.modis_coverage[i])}`); if (S.A.gmted_land_fraction[i] < 0.5) warn.push(`land fraction ${pct(S.A.gmted_land_fraction[i])}`);
        X.filter(x => x.similarity == null).forEach(x => warn.push(`no Earth ${shortOf(x.criterion)}`));
        return `<tr><td>${k + 1}</td><td>${esc(candShort(i))}</td>${S.critIds.map(x => { const v = byC[x]; if (!v) return `<td class="n meta">${t.status[x] === "DIRECT" ? "w=0" : "—"}</td>`;
          if (v.similarity == null) return `<td class="n"><span class="st st-m">gap</span></td>`;
          const cls = v.similarity >= 0.85 ? "c-match" : v.similarity >= 0.6 ? "c-partial" : "c-mismatch"; return `<td class="n ${cls}">${v.similarity.toFixed(2)}</td>`; }).join("")}
          <td>${warn.length ? warn.map(x => `<span class="tag st-u">${esc(x)}</span>`).join(" ") : '<span class="meta">none</span>'}</td></tr>`; }).join("")}</tbody></table></div>

A3_INPUTS["mm-c"] = a => { A3.mm.crit = a.value; atRender(); };

/* ===== Phase III · Earth-to-World Analogue Translator and Analogue Expedition Designer =====
 * Translator: states, criterion by criterion, in what sense an Earth cell is (and is not) analogous
 * to a target — a partial analogy, never an equivalence.
 * Expedition designer: turns chosen candidates into analytical field objectives and measurement
 * needs. It contains no travel, cost, access, permit or safety information and invents none. */
const AT_FACTS = {
  Mars: { src: "NASA NSSDCA Mars Fact Sheet, https://nssdc.gsfc.nasa.gov/planetary/factsheet/marsfact.html",
    items: [["Surface gravity", "3.71 m/s² (0.38 of Earth)"], ["Mean surface pressure", "~6.36 mbar (~0.6 % of Earth's); MEDA median at Jezero 740 Pa (baseline record)"],
      ["Atmosphere", "~95 % CO₂"], ["Length of day", "24.66 h (sol)"], ["Liquid water", "not stable at the surface under present conditions"]] },
  Moon: { src: "NASA NSSDCA Moon Fact Sheet, https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html",
    items: [["Surface gravity", "1.62 m/s² (0.165 of Earth)"], ["Atmosphere", "none (exosphere only)"], ["Length of day", "29.53 Earth days (synodic)"],
      ["Thermal cycle", "local times 13–14 h and 01–02 h are lunar hours (~29.5 Earth hours each): the lunar ΔT develops over ~2 weeks, the Earth ΔT over ~12 h"],
      ["Surface", "regolith; no weathering by water or wind"]] },
};
function atTranslate(t, i) {
  const R = atCands(t, 20), w = atWeights(), X = R.eligible ? ATL.explain(R.P, w, i, S.A, R.ranges) : [], by = Object.fromEntries(X.map(x => [x.criterion, x]));
  return S.critIds.map(c => {
    const st = t.status[c], x = by[c];
    if (st === "INCOMPATIBLE") return { c, verdict: "NO COUNTERPART", text: t.status_reason[c] };
    if (st === "PROXY") return { c, verdict: "PROXY ONLY", text: `Represented by a rule-based proxy (${t.status_reason[c]}); the Earth value ${atVal(c, S.A[c][i])} is not compared with a target measurement.` };
    if (st !== "DIRECT") return { c, verdict: "NOT COMPARABLE", text: `The target has no ${st === "MISSING" ? "assembled" : "validated"} value: ${t.status_reason[c]}` };
    if (!x || x.similarity == null) return { c, verdict: "NOT COMPARABLE", text: `No Earth value at this cell for ${labelOf(c)}.` };
    const v = x.similarity >= 0.85 ? "ANALOGOUS" : x.similarity >= 0.6 ? "PARTIALLY ANALOGOUS" : "NOT ANALOGOUS";
    const extra = c === "lst_diurnal_range" && t.body === "Moon" ? " The lunar cycle lasts ~29.5 Earth days, so equal ΔT does not mean an equal heating rate." :
      c === "lst_diurnal_range" ? " Ground temperature from a different instrument and retrieval; compare magnitudes, not absolute calibration." :
      c === "annual_temperature_range" ? " Mars 'months' are 30° Ls bins (~56 sols)." : " Same algorithm at the same ~1 km baseline.";
    return { c, verdict: v, s: x.similarity, text: `Earth ${atVal(c, x.earth)} vs ${t.name} ${atVal(c, x.target)} (s = ${x.similarity.toFixed(2)}).${extra}` };
  });
}
const AT_VCLS = { ANALOGOUS: "c-match", "PARTIALLY ANALOGOUS": "c-partial", "NOT ANALOGOUS": "c-mismatch", "NOT COMPARABLE": "st-m", "NO COUNTERPART": "st-x", "PROXY ONLY": "st-p" };

/* ===== Phase III · Knowledge Constellation =====

/* ===== Phase III · Research Copilot Workspace and Provenance =====
 * Copilot: the deterministic core answers only questions whose answer is a lookup in the evidence
 * index built from the atlas (values, statuses, readiness, provenance); anything else returns
 * "I cannot determine that from the available evidence." An OPTIONAL language-model mode (the
 * viewer's own Claude, via the artifact `sample` capability) may rephrase evidence; its answer is
 * shown only if it cites existing evidence ids, is screened by the Phase II guardrails, and is
 * labelled as drafted text. It never computes or changes a score. */

    for (const c of S.critIds) {

    }
    out.push({ id: `${t.id}.readiness`, kind: "readiness", aliases, target: t.id, targetName: t.name.split(" (")[0], criterion: null, status: null,
      text: `${t.name} has readiness L${t.readiness.level} (${t.readiness.label}): ${t.readiness.direct} directly comparable criteria.` });
    out.push({ id: `${t.id}.location`, kind: "location", aliases, target: t.id, targetName: t.name.split(" (")[0], criterion: null, status: null,
      text: `${t.name} is at ${atFmtLL(t.anchor.lat, t.anchor.lon)} (${t.anchor.type}; ${t.anchor.source || "catalogue"}).` });

  keep ? a4RenderKeep(id) : atRender();
}
function a4RenderKeep(id) {
  atRender();
  const el = document.querySelector(`.p4-tree [data-tid="${CSS.escape(id)}"]`);
  if (el) { $$('.p4-tree [role="treeitem"]').forEach(y => y.tabIndex = -1); el.tabIndex = 0; el.focus(); }
}

/* ---------- search combobox (aliases, prefixes; updates its own listbox without re-rendering the page) ---------- */
function a4SearchBox() {
  return `<div class="p4-search" role="search"><label for="a4q" class="sr-only">Search the planetary atlas</label>
    <input id="a4q" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="a4sr" autocomplete="off" data-a4live="q" value="${esc(A4.q)}" placeholder="Search features, aliases, missions — e.g. Gale Crater, Shackleton, Apollo 15">
    <ul id="a4sr" role="listbox" class="p4-sr" aria-label="Search results" hidden></ul></div>`;
}
function a4SearchUpdate(inp) {
  A4.q = inp.value;
  const box = $("#a4sr"), hits = RG.search(A4.ix, A4.q, { limit: 10 });
  A4._hits = hits; A4._hi = hits.length ? 0 : -1;
  if (!A4.q.trim()) { box.hidden = true; inp.setAttribute("aria-expanded", "false"); inp.removeAttribute("aria-activedescendant"); return; }
  box.innerHTML = hits.length ? hits.map((h, k) => {
    const L = h.kind === "location" ? a4L(h.id) : null;
    return `<li role="option" id="a4sr-${k}" aria-selected="${k === 0}" data-a4="hit" data-k="${k}"><b>${esc(h.name)}</b> <span class="meta">${h.kind === "region" ? "region" : esc(L.feature_type)} · ${h.body === "mars" ? "Mars" : "Moon"}${L ? " · L" + L.readiness.level : ""} · ${esc(h.matched)}</span></li>`;
  }).join("") : `<li role="option" aria-disabled="true" class="meta">No catalogued feature matches “${esc(A4.q)}”.</li>`;
  box.hidden = false; inp.setAttribute("aria-expanded", "true");
  if (hits.length) inp.setAttribute("aria-activedescendant", "a4sr-0");
  announce(hits.length ? `${hits.length} results. Use the arrow keys, Enter to open.` : "No results.");
}
function a4SearchKey(e) {
  const hits = A4._hits || []; if (!hits.length) { if (e.key === "Escape") { e.target.value = ""; a4SearchUpdate(e.target); } return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    A4._hi = (A4._hi + (e.key === "ArrowDown" ? 1 : hits.length - 1)) % hits.length;
    $$("#a4sr [role=option]").forEach((o, k) => o.setAttribute("aria-selected", k === A4._hi));
    e.target.setAttribute("aria-activedescendant", "a4sr-" + A4._hi); e.preventDefault();
  } else if (e.key === "Enter") { a4OpenHit(hits[Math.max(0, A4._hi)]); e.preventDefault(); }
  else if (e.key === "Escape") { $("#a4sr").hidden = true; e.target.setAttribute("aria-expanded", "false"); }
}
function a4OpenHit(h) {
  if (!h) return;
  A4.q = ""; A4._hits = [];
  if (h.kind === "region") { A4.body = h.body; A4.region = h.id; A4.tree[h.id] = true; A4.mode = "browse"; }
  else { a4SyncFromLocation(h.id); A4.tree[a4L(h.id).region] = true; A4.mode = "browse"; }
  atRender(); const n = $(".p4-summary h3"); if (n) { n.tabIndex = -1; n.focus(); }
}

/* ---------- selected-location summary ---------- */
function a4Summary(l) {
  if (!l) return `<div class="empty">Select a location in the tree, the map or the list.</div>`;
  const reg = A4.ix.regions[l.region], ts = l.target_ids.map(a4T);

  const src = l.source || {};

    : `<p class="note small">Catalogue entry: name and coordinates from the cited source; no analytical window has been assembled. Checks: ${l.readiness.checks.map(c => `${c.passed ? "✓" : "✗"} ${esc(c.id)}`).join(" · ")}.</p>`;
  const tsel = ts.find(x => x.id === A3.active) || ts[0];
  const crumbs = `<nav class="p4-crumbs" aria-label="Location in the hierarchy"><button data-a4="body" data-b="${l.body}">${l.body === "mars" ? "Mars" : "Moon"}</button><i>›</i><button data-a4="region" data-id="${reg.id}">${esc(reg.name)}</button><i>›</i><span ${tsel ? "" : 'aria-current="location"'}>${esc(l.name)}</span>${tsel ? `<i>›</i><span aria-current="location">${esc(tsel.name)}</span>` : ""}</nav>`;
  return `<article class="p4-summary" aria-label="Selected location">${crumbs}
    <div class="row p4-sh">${a4Thumb(l, 104)}<div class="grow"><div class="body-tag">${l.body === "mars" ? "MARS" : "MOON"} · ${esc(reg.name)}</div>
      <h3 class="ttl">${esc(l.name)} ${a4Star(l.id)}</h3>
      <div class="meta">${esc(l.feature_type)} · ${a4Ll(l)}${l.diameter_km ? ` · Ø ${l.diameter_km.toFixed(1)} km` : ""}${l.quadrangle ? " · " + esc(l.quadrangle) : ""}</div>
      ${l.aliases.length ? `<div class="meta">Also: ${esc(l.aliases.join(", "))}</div>` : ""}
      <div class="row">${a4Level(l)}<span class="tag">${esc(l.record_type.replace("_", " "))}</span>${l.approval ? `<span class="tag">${esc(l.approval)}</span>` : ""}</div></div></div>
    <p class="meta small">Source: ${src.url ? `<a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.type)} record</a>` : esc(src.type || "")}${src.reference ? " · " + esc(src.reference) : ""} · ${esc(l.coordinate_reference)}</p>
    <div class="p4-qa" role="group" aria-label="Actions for ${esc(l.name)}">${qa.map(a => `<button class="btn-sm" data-a4="qa" data-q="${a.id}" data-t="${esc(a.target || "")}" ${a.enabled ? "" : `disabled aria-describedby="qa-${a.id}"`}>${esc(a.label)}</button>`).join("")}</div>
    ${qa.filter(a => !a.enabled).map(a => `<p class="meta small" id="qa-${a.id}"><b>${esc(a.label)}:</b> ${esc(a.reason)}</p>`).join("")}
    ${ts.length ? `<div class="lbl">Analytical targets (${ts.length})</div><div class="tbl-wrap"><table class="t"><thead><tr><th>Target</th><th>Readiness</th>${S.critIds.map(c => `<th title="${esc(labelOf(c))}">${esc(shortOf(c))}</th>`).join("")}<th>Datasets</th></tr></thead><tbody>
      ${ts.map(t => `<tr><td><button class="lnk" data-a4="tgt" data-id="${t.id}">${esc(t.name)}</button>${t.legacy ? ' <b class="at-base">BASELINE</b>' : ""}</td><td>${a4Level(t)}</td>${S.critIds.map(c => { const s = t.fingerprint.criterion_status[c]; return `<td class="${{ DIRECT: "st-d", PROXY: "st-p", "N/A": "st-x", MISSING: "st-m" }[s]}" title="${esc(s)}">${s === "DIRECT" ? atVal(c, t.fingerprint.variables[c]) : esc(s)}</td>`; }).join("")}<td class="small">${t.datasets.map(d => esc(d)).join(", ")}</td></tr>`).join("")}</tbody></table></div>` : ""}
    ${ts.length ? a4DataPanel(ts) : `<p class="note small"><b>Analysis support:</b> Earth-analogue analysis — no (catalogued only). Target comparison — no. Needed first: a documented terrain or environmental dataset processed into a complete 55.6 km window (readiness 2), then a complete compatible fingerprint (readiness 3).</p>`}
    <div class="lbl">Why this readiness level</div>${why}
    ${l.missions.length ? `<p class="meta small">Missions: ${l.missions.map(m => esc((A4.ix.missions[m] || {}).name || m)).join(" · ")}</p>` : ""}
    <p class="meta small">Readiness concerns data completeness and reproducibility only — not scientific validity, landing safety or habitability.</p></article>`;
}

/* ---------- data panel: what is measured, by what, at which support; what is missing; what is supported ---------- */
function a4DataPanel(ts) {
  return ts.map(t => {
    const fp = t.fingerprint, D = A4.ix.datasets;
    const rows = S.critIds.map(c => {
      const st = fp.criterion_status[c], ds = (fp.provenance[c] || []).map(d => D[d]).filter(Boolean);
      return `<tr><td>${esc(labelOf(c))}</td><td class="${{ DIRECT: "st-d", PROXY: "st-p", "N/A": "st-x", MISSING: "st-m" }[st]}">${esc(st)}</td><td class="n">${fp.variables[c] == null ? "—" : atVal(c, fp.variables[c])}</td><td class="small">${esc(fp.units[c])}</td>
        <td class="small">${ds.length ? ds.map(d => `<a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.product_id)}</a> · ${esc(d.provider)} · ${esc(d.original_resolution)}`).join("<br>") : st === "PROXY" ? "rule (not a measurement)" : "—"}</td>
        <td class="small">${esc(fp.spatial_support[c] || fp.missingness[c] || (st === "N/A" ? "no physical counterpart" : "—"))}${fp.temporal_support[c] ? "<br><span class=\"meta\">" + esc(fp.temporal_support[c]) + "</span>" : ""}</td></tr>`;
    }).join("");
    const sc = t.scoring, comp = t.readiness.level >= 3 ? "yes — with any target sharing a DIRECT criterion (Comparison Lab)" : "partial — shared DIRECT criteria only, labelled exploratory";
    return `<details class="p4-checks p4-data" ${t.id === A3.active ? "open" : ""}><summary>Data · ${esc(t.name)}</summary>
      <p class="small"><b>Earth-analogue analysis:</b> ${sc.earth_analogue_enabled ? `yes — ${esc(sc.default_explore)}${A4X.ids.includes(t.id) || t.legacy ? " (also in Explore)" : ""}` : `partial only — ${esc(sc.reason)}`}<br><b>Comparison with other targets:</b> ${comp}</p>
      <div class="tbl-wrap"><table class="t"><caption class="sr-only">Criteria, values, sources and support for ${esc(t.name)}</caption><thead><tr><th>Criterion</th><th>Status</th><th class="n">Value</th><th>Unit</th><th>Dataset · provider · resolution</th><th>Spatial / temporal support</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="small"><b>Window:</b> ${t.location.window_km} km centred ${atFmtLL(t.location.latitude, t.location.longitude_east)} · ${esc(t.location.relation)} · terrain ${t.terrain_window.bins_filled}/${t.terrain_window.bins_total} bins</p>
      ${t.limitations.length ? `<p class="small"><b>Limitations:</b></p><ul class="lab-ul small">${t.limitations.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      <p class="small"><b>References:</b> ${t.sources.map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//, "").slice(0, 60))}</a>`).join(" · ")}</p>
      <p class="meta small">${esc(t.validation.scientific_validation)}</p></details>`;
  }).join("");
}

/* ---------- region cards / list / table ---------- */
function a4RegionCards() {
  const regs = A4.reg.regions.filter(r => r.body === A4.body);
  return `<div class="p4-regions">${regs.map(r => `<article class="p4-rc${A4.region === r.id ? " act" : ""}"><button class="p4-rcb" data-a4="region" data-id="${r.id}" aria-label="${esc(r.name)}: ${r.counts.locations} locations, ${r.counts.targets} analytical targets">
    ${r.thumbnail ? `<img src="${esc(r.thumbnail)}" alt="" width="64" height="64" loading="lazy">` : `<span class="p4-th none" style="width:64px;height:64px"><span>No imagery</span></span>`}
    <span><b>${esc(r.name)}</b><span class="meta small">${esc(r.description)}</span>
    <span class="p4-cnt"><i>${r.counts.locations} locations</i><i>${r.counts.targets} targets</i><i>${r.counts.scoring_enabled} L3+</i>${[4, 3, 2, 1].filter(k => r.counts.by_level[k]).map(k => `<i class="lvl lvl-${k}">L${k}×${r.counts.by_level[k]}</i>`).join("")}</span></span></button></article>`).join("")}</div>`;
}
function a4ListCards(locs) {
  return locs.length ? `<div class="p4-cards">${locs.map(l => `<article class="p4-card${l.id === A4.loc ? " act" : ""}">${a4Thumb(l, 72)}<div class="grow">
    <button class="lnk p4-ct" data-a4="loc" data-id="${esc(l.id)}">${esc(l.name)}</button> ${a4Star(l.id)}
    <div class="meta small">${esc(l.feature_type)} · ${a4Ll(l)} · ${esc(A4.ix.regions[l.region].name)}</div>
    <div class="row">${a4Level(l)}${l.target_ids.length ? `<span class="tag">${l.target_ids.length} target${l.target_ids.length > 1 ? "s" : ""}</span>` : `<span class="tag">catalogue only</span>`}</div></div></article>`).join("")}</div>`
    : `<div class="empty">No location matches these filters.</div>`;
}
function a4Table(locs) {
  const th = (k, label) => `<th scope="col" aria-sort="${A4.sort === k ? "descending" : "none"}"><button class="lnk" data-a4="sort" data-k="${k}">${esc(label)}</button></th>`;
  return `<div class="tbl-wrap"><table class="t p4-tbl"><caption class="sr-only">Locations on ${A4.body === "mars" ? "Mars" : "the Moon"}, sorted by ${esc(A4.sort)}</caption><thead><tr>${th("name", "Location")}${th("region", "Region")}<th scope="col">Type</th>${th("latitude", "Lat")}${th("longitude", "Lon")}${th("readiness", "Readiness")}${th("targets", "Targets")}<th scope="col">Datasets</th><th scope="col">Source</th></tr></thead><tbody>
    ${locs.map(l => `<tr${l.id === A4.loc ? ' class="act"' : ""}><td><button class="lnk" data-a4="loc" data-id="${esc(l.id)}">${esc(l.name)}</button></td><td>${esc(A4.ix.regions[l.region].name)}</td><td class="small">${esc(l.feature_type)}</td><td class="n">${l.latitude.toFixed(2)}</td><td class="n">${l.longitude_east.toFixed(2)}</td><td>${a4Level(l)}</td><td class="n">${l.target_ids.length}</td><td class="small">${Array.from(new Set(l.target_ids.flatMap(t => a4T(t).datasets))).join(", ") || "—"}</td><td class="small">${l.source.url ? `<a href="${esc(l.source.url)}" target="_blank" rel="noopener">${esc(l.source.type)}</a>` : esc(l.source.type)}</td></tr>`).join("")}</tbody></table></div>`;
}
function a4Filters() {
  const R = A4.reg, regs = R.regions.filter(r => r.body === A4.body), ms = R.missions.filter(m => m.body === A4.body);
  const ds = Array.from(new Set(R.targets.filter(t => t.body.id === A4.body).flatMap(t => t.datasets))).sort();
  const sel = (key, label, opts, cur) => `<label>${esc(label)}<select data-a4in="${key}"><option value="">any</option>${opts.map(([v, t]) => `<option value="${esc(v)}" ${String(cur) === String(v) ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></label>`;
  return `<div class="lab-form p4-filters">
    ${A4.mode !== "browse" ? sel("region", "Region", regs.map(r => [r.id, r.name]), A4.region || "") : ""}
    ${sel("level", "Readiness", [1, 2, 3, 4].map(k => [k, `L${k} · ${R.readiness_model.levels[k].label.toLowerCase()}`]), A4.f.level)}
    ${sel("mission", "Mission", ms.map(m => [m.id, m.name]), A4.f.mission)}
    ${sel("dataset", "Dataset", ds.map(d => [d, d]), A4.f.dataset)}
    ${sel("ftype", "Terrain category", Array.from(new Set(R.locations.filter(l => l.body === A4.body).map(l => l.feature_type))).sort().map(v => [v, v]), A4.f.ftype)}
    ${sel("type", "Record type", [["catalog_location", "catalogue location"], ["reference_area", "reference area"]], A4.f.type)}
    ${A4.mode === "list" || A4.mode === "table" ? `<label>Sort<select data-a4in="sort">${A4_SORTS.map(([k, t]) => `<option value="${k}" ${A4.sort === k ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></label>` : ""}
    <label class="ck"><input type="checkbox" data-a4in="analytical" ${A4.f.analytical ? "checked" : ""}> analytical targets only</label></div>`;
}
function a4Strip(title, ids) {
  const ls = ids.map(a4L).filter(Boolean);
  if (!ls.length) return "";
  return `<div class="row p4-strip"><span class="lbl">${esc(title)}</span>${ls.map(l => `<button class="tag" data-a4="loc" data-id="${esc(l.id)}">${esc(l.name)} <span class="meta">L${l.readiness.level}</span></button>`).join("")}</div>`;
}

function a4ActiveStrip() {
  const ids = Array.from(new Set([A3.active, ...A4.cmp, ...A3.sel].filter(id => a4T(id))));
  if (!ids.length) return "";
  return `<div class="row p4-strip" role="group" aria-label="Active analytical targets"><span class="lbl">Active targets</span>${ids.map(id => { const t = a4T(id); return `<button class="tag${id === A3.active ? " on" : ""}" data-a4="tgtsw" data-id="${id}" aria-pressed="${id === A3.active}">${esc(t.name.split(" (")[0])} <span class="meta">L${t.readiness.level}</span></button>`; }).join("")}</div>`;
}
A3_VIEWS.home = function () {
  const need = a4Need(); if (need) return need;
  const R = A4.reg, c = RG.counts(A4.ix), cb = RG.counts(A4.ix, R.locations.filter(l => l.body === A4.body));
  const locs = a4Filter(), l = a4L(A4.loc);
  const lvRow = cb.byLevel.slice(1).map((n, j) => [n, j + 1]).map(([n, k]) => `<span class="lvl lvl-${k}" title="${esc(R.readiness_model.levels[k].definition)}">L${k} ${n}</span>`).join("");
  let h = `<div class="sec p4-hero"><div class="row" style="justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap">
    <div><div class="body-tag">PLANETARY ATLAS · REGISTRY ${esc(R.registry_version)}</div><h2 class="ttl p4-h">${A4.body === "mars" ? "Mars" : "The Moon"}</h2>
    <p class="note">${c.locations} catalogued locations on Mars and the Moon in ${R.regions.length} regions; ${c.targets} analytical targets, ${c.scoring} of them complete enough (readiness ≥ 3) for Earth-analogue ranking. Names and coordinates come from the IAU/USGS gazetteer or cited mission sources; values only from mission data processed by recorded scripts.</p></div>
    <span class="toggles p4-body" role="group" aria-label="Body">${[["mars", "Mars"], ["moon", "Moon"]].map(([b, t]) => `<button aria-pressed="${A4.body === b}" data-a4="body" data-b="${b}">${t}</button>`).join("")}</span></div>
    ${a4Banner("planetary atlas")}${a4SearchBox()}
    <div class="row meta p4-lv">${A4.body === "mars" ? "Mars" : "Moon"} locations by readiness: ${lvRow}</div>
    ${a4ActiveStrip()}${a4Strip("Recent", A4P.recent.filter(id => a4L(id) && a4L(id).body === A4.body).slice(0, 6))}${a4Strip("Favourites", A4P.fav.filter(id => a4L(id) && a4L(id).body === A4.body))}
    <div class="p4-modes" role="tablist" aria-label="Atlas views">${A4_MODES.map(([k, t]) => `<button role="tab" aria-selected="${A4.mode === k}" data-a4="mode" data-m="${k}">${t}</button>`).join("")}</div></div>`;
  if (A4.mode === "browse") {
    h += `<div class="sec p4-split"><div class="p4-col-tree"><div class="lbl">Regions → locations → targets</div>${a4Tree()}<p class="meta small">Arrow keys move, → expands, ← collapses, Enter selects.</p></div>
      <div class="p4-col-main">${a4LocMap(A4.body, R.locations.filter(x => x.body === A4.body))}${a4Summary(l && l.body === A4.body ? l : null)}</div></div>`;
  } else if (A4.mode === "regions") {
    h += `<div class="sec">${a4RegionCards()}</div>`;
    if (A4.region && A4.ix.regions[A4.region] && A4.ix.regions[A4.region].body === A4.body) h += `<div class="sec"><div class="lbl">${esc(A4.ix.regions[A4.region].name)} — locations</div>${a4ListCards(locs)}</div>`;
  } else {
    h += `<div class="sec">${a4Filters()}<div class="meta">Showing ${locs.length} of ${cb.locations} ${A4.body === "mars" ? "Mars" : "Moon"} locations.</div></div>
      <div class="sec">${A4.mode === "table" ? a4Table(locs) : a4ListCards(locs)}</div>`;
    if (l && l.body === A4.body) h += `<div class="sec">${a4Summary(l)}</div>`;
  }
  return h;
};

/* ---------- quick actions ---------- */
function a4Quick(q, tid) {
  const t = tid && atT(tid);
  if (q === "target" && t) { A3.active = tid; A3.view = "target"; }
  else if (q === "analogues" && t) { A3.active = tid; A3.view = "workflow"; }
  else if (q === "explore") { a4ExploreOpen(tid); return; }
  else if (q === "compare" && tid) { if (!A4.cmp.includes(tid)) A4.cmp.push(tid); if (!A3.sel.includes(tid)) A3.sel.push(tid); A3.view = "lab4"; A4.aggRes = null; }
  else if (q === "validation" && tid) { A4.val.target = tid; A4.val.res = null; A3.view = "validation"; }
  else if (q === "collection") { A4.colPending = { kind: "location", id: A4.loc }; A3.view = "collections"; }
  else if (q === "provenance") { A4.prov.focus = tid || A4.loc; A3.view = "readiness"; }
  $("#left").scrollTop = 0; atRender();
}

/* ---------- events (namespaced data-a4* attributes) ---------- */
document.addEventListener("click", e => {
  const a = e.target.closest("[data-a4]"); if (!a || a.disabled) return;
  const fn = A4_ACTIONS[a.dataset.a4]; if (fn) { e.preventDefault(); fn(a, e); }
});
document.addEventListener("change", e => { const a = e.target.closest("[data-a4in]"); if (a && A4_INPUTS[a.dataset.a4in]) A4_INPUTS[a.dataset.a4in](a, e); });
document.addEventListener("input", e => { const a = e.target.closest("[data-a4live]"); if (a && A4_INPUTS[a.dataset.a4live]) A4_INPUTS[a.dataset.a4live](a, e); });
document.addEventListener("keydown", e => {

/* ===== Phase IV · Offline support =====
 * public/sw.js (generated by scripts/build_web.py) precaches the core files under a cache named after a hash of
 * every published file, so a new build gets a new cache and old caches are deleted on activation. Requests are
 * network-first with a cache fallback: online visitors always get the current files; offline visitors get the
 * last copy cached. The predictor stack, atlas grids, Earth sub-cell data, Phase II series and the registry are
 * SHA-256-verified on load, and the atlas / registry / Phase II context must name the same stack, so a stale or
 * corrupted cached copy of those files is refused (with a message) rather than used. Needs the network: web fonts (system fonts are used
 * offline), external source links, and files never opened online before (e.g. the Phase II series). */
const A4O = { sw: null, status: null, est: null, err: null };
function a4SwMsg(msg) {
  return new Promise(res => {
    const c = navigator.serviceWorker && navigator.serviceWorker.controller; if (!c) return res(null);
    const ch = new MessageChannel(); ch.port1.onmessage = e => res(e.data); c.postMessage(msg, [ch.port2]); setTimeout(() => res(null), 3000);
  });
}
async function a4OfflineRefresh() {
  try { A4O.status = await a4SwMsg({ type: "status" }); } catch (e) { A4O.err = e.message; }
  try { if (navigator.storage && navigator.storage.estimate) A4O.est = await navigator.storage.estimate(); } catch (e) { }
  if (S.tab === "atlas" && A3.view === "readiness") atRender();
}
function a4OfflinePanel() {
  const sup = "serviceWorker" in navigator, st = A4O.status;
  const est = A4O.est ? `${(A4O.est.usage / 1048576).toFixed(1)} MB used of ~${(A4O.est.quota / 1048576).toFixed(0)} MB available to this site` : "storage estimate unavailable";
  return `<div class="sec" id="offline"><div class="lbl">Offline use</div>
    ${!sup ? `<p class="note">This browser does not support service workers; the app works online only.</p>` :
      !A4O.sw ? `<p class="note">Offline support is ${location.protocol === "file:" ? "unavailable from a file:// page" : "not active yet (it registers after the first full load)"}.</p>` :
      `<p class="note">Service worker ${st ? `active · cache <span class="mono">${esc(st.cache)}</span> · ${st.coreCached}/${st.core} core files cached${st.coreCached < st.core ? " (offline start needs every core file; open the app online once more)" : " — the app can start offline"} · ${st.entries} files in total` : "registered; status pending"} · ${esc(est)}.</p>`}
    <p class="meta small">Works offline once cached: Explore, Compare, Scenarios, Discover, Data, Method, the Atlas and every Phase IV module. Needs the network: web fonts (system fonts are used offline), external source links, and any file not yet opened online (the Phase II time series loads on first use). The predictor stack, atlas grids, sub-cell data, Phase II series and registry are SHA-256-verified when loaded (app.json, targets and labels are not individually hashed); a stale or damaged copy of a verified file is refused with a message — clear the cache below and reload online.</p>
    <div class="row"><button class="btn-sm" data-a4="swrefresh" ${A4O.sw ? "" : "disabled"}>Refresh status</button><button class="btn-sm" data-a4="swclear" ${A4O.sw ? "" : "disabled"}>Clear offline cache</button></div>
    ${A4O.err ? `<p class="small st-m">${esc(A4O.err)}</p>` : ""}</div>`;
}
Object.assign(A4_ACTIONS, {
  swrefresh() { a4OfflineRefresh(); },
  async swclear() { const r = await a4SwMsg({ type: "clear" }); A4O.status = null; A4O.err = r && r.cleared != null ? `Cleared ${r.cleared} cache(s). Reload while online to re-cache.` : "The service worker did not answer."; atRender(); },
});
(function a4Register() {
  if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => { A4O.sw = reg; setTimeout(a4OfflineRefresh, 1500); })
      .catch(e => { A4O.err = "Service worker registration failed: " + e.message; });
  });
})();

function m6Report(kind) {

    methods: Object.fromEntries(AR.methods.map(m => [m, { ...MT.METHODS[m], n_eligible: AR.results[m].nEligible, top: AR.results[m].top.slice(0, 10).map(i => ({ cell_id: S.cell[i], score: +AR.results[m].eff[i].toFixed(12) })) }])),
    pairs: AR.pairs, method_robust_sites: AR.robust.map(i => S.cell[i]), baseline_matches_explore: AR.baselineCheck === 0,

document.addEventListener("click", e => {

document.addEventListener("change", e => {
