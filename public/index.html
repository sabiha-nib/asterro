<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASTERRO</title>
<meta name="description" content="ASTERRO — Planetary Analogue Intelligence. Find Earth's environmental analogues for worlds beyond Earth. Deterministic, traceable, NASA data.">
<meta name="application-name" content="ASTERRO">
<meta property="og:title" content="ASTERRO — Planetary Analogue Intelligence">
<meta property="og:description" content="Find Earth's environmental analogues for worlds beyond Earth. Deterministic similarity on NASA, USGS and PDS data; every score traceable and reproducible.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>/* ASTERRO · Planetary Analogue Intelligence — mission-instrument visual system (single dark theme, deliberate). */
[hidden]{display:none!important}
:root{
  color-scheme: dark;
  --ground:#090B0E; --panel:#0F1317; --panel-2:#141A1F; --raise:#1A2128;
  --line:#212931; --line-2:#2E3842; --ink:#E6E9EC; --ink-2:#A4AEB9; --ink-3:#6C7783;
  --mars:#E0874F; --moon:#AFC7DA; --cross:#D6C07A; --earth:#7FB3AE;
  --accent:var(--mars); --accent-dim:#5b3520;
  --match:#8CC08F; --partial:#D8B45B; --mismatch:#D9705F;
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",system-ui,sans-serif;
  --f-body:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:3px; --bar-h:58px;
}
#app[data-target="moon_south_pole"]{--accent:var(--moon);--accent-dim:#2c3c48}
#app[data-target="cross"]{--accent:var(--cross);--accent-dim:#4a4226}
html,body{height:100%;background:var(--ground);color:var(--ink)}
body{font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:var(--bar-h) minmax(0,1fr) auto;min-height:0}
.bar,.stage,.console{min-width:0}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--ground);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);flex:none}
.brand-txt{display:flex;flex-direction:column;line-height:1;width:157px} /* = width of the previous wordmark: keeps the tab bar in place */
.brand-txt b{font:800 19px/1 var(--f-display);letter-spacing:.14em}
.brand-txt span{font:500 9.5px/1.3 var(--f-mono);letter-spacing:.18em;color:var(--ink-3)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs button{font:600 11px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;padding:9px 11px;color:var(--ink-3);border-radius:var(--r);white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--panel-2);box-shadow:inset 0 -2px 0 var(--accent)}
.target-ctl{display:flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;flex:none}
.target-ctl button{padding:6px 11px;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;border-right:1px solid var(--line)}
.target-ctl button:last-child{border-right:0}
.target-ctl i{font:500 9px/1.3 var(--f-mono);letter-spacing:.2em;font-style:normal;color:var(--ink-3)}
.target-ctl button[aria-checked="true"]{background:var(--panel-2);color:var(--ink)}
.target-ctl button[aria-checked="true"] i{color:var(--accent)}
.btn-search,.btn-primary{font:700 15px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase;background:var(--accent);color:#120c08;padding:11px 18px;border-radius:var(--r);flex:none;transition:filter .2s}
.btn-search:hover,.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{font:600 13px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--line-2);padding:11px 16px;border-radius:var(--r);color:var(--ink-2)}
.btn-ghost:hover{color:var(--ink);border-color:var(--ink-3)}
.btn-sm{font:600 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line-2);padding:8px 10px;border-radius:var(--r);color:var(--ink-2);background:var(--panel)}
.btn-sm:hover{color:var(--ink);border-color:var(--accent)}
.btn-sm.on{color:#120c08;background:var(--accent);border-color:var(--accent)}

/* ---------- stage ---------- */
.stage{display:grid;grid-template-columns:minmax(330px,390px) minmax(0,1fr) minmax(280px,320px);min-height:0;position:relative}
.panel{background:var(--panel);min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.left{border-right:1px solid var(--line)}
.right{border-left:1px solid var(--line)}
#app.is-hero .left,#app.is-hero .right{opacity:.0;pointer-events:none}
#app .left,#app .right{transition:opacity .6s ease}
#app.wide .stage{grid-template-columns:minmax(560px,760px) minmax(0,1fr) minmax(280px,320px)}

.viewport{position:relative;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 45%,#0d1319 0%,var(--ground) 70%)}
#globe{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#globe:active{cursor:grabbing}
.vp-top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;pointer-events:none;z-index:2}
.seg{display:flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:rgba(9,11,14,.78);pointer-events:auto;backdrop-filter:blur(4px)}
.seg button{font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;padding:8px 10px;color:var(--ink-3)}
.seg button[aria-pressed="true"]{color:var(--ink);background:var(--raise)}
#app.is-hero .vp-top,#app.is-hero .legend,#app.is-hero .status{opacity:0}
.legend{position:absolute;left:14px;bottom:44px;z-index:2;background:rgba(9,11,14,.8);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;min-width:220px;transition:opacity .5s}
.legend h4{margin:0 0 6px;font:500 9.5px/1 var(--f-mono);letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase}
.legend .ramp{height:8px;border-radius:1px}
.legend .ticks{display:flex;justify-content:space-between;font:400 10.5px/1.6 var(--f-mono);color:var(--ink-2)}
.legend .sw{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--ink-2)}
.legend .sw span{display:inline-flex;align-items:center;gap:6px}
.legend .sw i{width:10px;height:10px;border-radius:50%;display:inline-block}
.status{position:absolute;left:14px;right:14px;bottom:12px;font:400 10.5px/1.3 var(--f-mono);color:var(--ink-3);letter-spacing:.04em;z-index:2;transition:opacity .5s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readout{position:absolute;right:14px;bottom:40px;z-index:2;font:400 11px/1.5 var(--f-mono);color:var(--ink-2);background:rgba(9,11,14,.82);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;pointer-events:none;max-width:300px}
.readout:empty{display:none}
.readout b{color:var(--ink);font-weight:500}
.markers{position:absolute;inset:0;pointer-events:none;z-index:1}
.mk{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;font:500 10px/1 var(--f-mono);color:var(--ink);display:flex;align-items:center;gap:5px;transition:opacity .25s}
.mk i{width:9px;height:9px;border:1.5px solid var(--accent);border-radius:50%;background:rgba(9,11,14,.6);flex:none}
.mk span{background:rgba(9,11,14,.72);padding:2px 4px;border-radius:2px;letter-spacing:.06em}
.mk.sel i{width:15px;height:15px;background:var(--accent);box-shadow:0 0 0 4px rgba(224,135,79,.18)}
.mk.pick i{border-color:var(--ink);border-style:dashed}
.mk.back{opacity:0;pointer-events:none}

/* ---------- hero ---------- */
.hero{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:center;padding:32px clamp(20px,5vw,72px);background:linear-gradient(90deg,rgba(9,11,14,.94) 0%,rgba(9,11,14,.72) 44%,rgba(9,11,14,0) 75%);transition:opacity .9s ease,transform .9s ease}
#app:not(.is-hero) .hero{opacity:0;pointer-events:none;transform:translateX(-24px)}
.eyebrow{font:500 10.5px/1.4 var(--f-mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin:0 0 18px}
.hero h1{font:800 clamp(52px,8.4vw,118px)/.86 var(--f-display);letter-spacing:.01em;text-transform:uppercase;margin:0;max-width:9ch;text-wrap:balance}
.hero .sub{font-size:17px;color:var(--ink-2);max-width:40ch;margin:18px 0 26px}
.hero-targets{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.ht{display:flex;align-items:center;gap:12px;border:1px solid var(--line-2);border-radius:var(--r);padding:8px 14px 8px 8px;background:rgba(15,19,23,.85);text-align:left;min-width:230px}
.ht img{width:54px;height:54px;border-radius:2px;filter:grayscale(1) contrast(1.15);flex:none}
.ht span{display:flex;flex-direction:column;line-height:1.25}
.ht i{font:500 9.5px/1.4 var(--f-mono);letter-spacing:.2em;font-style:normal;color:var(--ink-3)}
.ht b{font:700 20px/1.1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.ht em{font:400 10.5px/1.5 var(--f-mono);font-style:normal;color:var(--ink-3)}
.ht[aria-checked="true"]{border-color:var(--accent);background:rgba(20,26,31,.95)}
.ht[aria-checked="true"] i{color:var(--accent)}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-facts{font:400 11px/1.6 var(--f-mono);color:var(--ink-3);margin:22px 0 0;letter-spacing:.04em;max-width:62ch}

/* ---------- panel content ---------- */
.sec{padding:16px 18px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.lbl{font:500 10px/1.2 var(--f-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl .n{color:var(--accent)}
h2.ttl{font:700 26px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:0}
h3.ttl{font:700 19px/1.05 var(--f-display);letter-spacing:.05em;text-transform:uppercase;margin:0}
.meta{font:400 11px/1.5 var(--f-mono);color:var(--ink-3)}
p.note{color:var(--ink-2);font-size:12.5px;margin:8px 0 0;max-width:62ch}
p.note.small{font-size:11.5px;color:var(--ink-3)}
.body-tag{font:500 10px/1 var(--f-mono);letter-spacing:.22em;color:var(--accent)}
.tgt-head{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center}
.tgt-head img{width:76px;height:76px;border-radius:2px;filter:grayscale(1) contrast(1.1)}
.cap{font:400 9.5px/1.4 var(--f-mono);letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.tag{display:inline-block;font:500 9px/1 var(--f-mono);letter-spacing:.14em;padding:3px 5px;border-radius:2px;border:1px solid var(--line-2);color:var(--ink-3);text-transform:uppercase;white-space:nowrap}
.tag.direct{color:var(--earth);border-color:#2e4a47}
.tag.proxy{color:var(--partial);border-color:#54452a}
.tag.na{color:var(--ink-3);border-style:dashed}
.big{font:800 54px/.9 var(--f-display);letter-spacing:.01em}
.big small{font:500 11px/1 var(--f-mono);letter-spacing:.18em;color:var(--ink-3);margin-left:8px;vertical-align:middle}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.kv{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv span{font:500 9.5px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.kv b{font:500 13px/1.3 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);overflow-wrap:anywhere}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toggles{display:flex;gap:4px}
.toggles button{font:500 9.5px/1 var(--f-mono);letter-spacing:.14em;padding:5px 7px;border-radius:2px;color:var(--ink-3);border:1px solid transparent;text-transform:uppercase}
.toggles button[aria-pressed="true"]{color:var(--ink);border-color:var(--line-2);background:var(--raise)}
.empty{color:var(--ink-3);font-size:13px;border:1px dashed var(--line-2);border-radius:var(--r);padding:14px;text-align:left}
svg text{font-family:var(--f-mono)}
.fp-svg{width:100%;height:auto;display:block}

/* criterion bars */
.cb{display:grid;grid-template-columns:104px 1fr 62px;gap:8px;align-items:center;padding:5px 0;font-size:12px}
.cb .nm{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb .v{font:400 11.5px/1 var(--f-mono);text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.track{position:relative;height:10px;background:var(--raise);border-radius:1px}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.85}
.track .mark{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink)}
.track .tmark{position:absolute;top:-4px;width:10px;height:10px;transform:translateX(-5px) rotate(45deg);border:1.5px solid var(--accent);background:var(--ground);top:0}

/* match / mismatch */
.mm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mm h5{margin:0 0 6px;font:500 10px/1 var(--f-mono);letter-spacing:.18em}
.mm ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.mm li{display:flex;gap:6px;align-items:baseline}
.mm li b{font-family:var(--f-mono);font-weight:500;width:12px;flex:none}
.c-match{color:var(--match)} .c-partial{color:var(--partial)} .c-mismatch{color:var(--mismatch)}
.mm .none{color:var(--ink-3);font-size:11.5px}

/* tables */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{font:500 9.5px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.t td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.t th.n{text-align:right}
table.t tr.hl td{background:rgba(255,255,255,.03)}
.pos{color:var(--match)} .neg{color:var(--mismatch)}

/* right rail list */
.rail-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.site{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;padding:9px 16px;border-bottom:1px solid var(--line);text-align:left;width:100%;align-items:center}
.site:hover{background:var(--panel-2)}
.site[aria-current="true"]{background:var(--raise);box-shadow:inset 3px 0 0 var(--accent)}
.site .rk{font:500 12px/1 var(--f-mono);color:var(--ink-3)}
.site .nm{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.site .sc{font:700 20px/1 var(--f-display);letter-spacing:.02em;text-align:right}
.site .sub{grid-column:2/3;font:400 10px/1.3 var(--f-mono);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site .mv{grid-column:3/4;font:500 10px/1 var(--f-mono);text-align:right}
.site .spark{grid-column:2/4;display:flex;gap:2px;height:4px;margin-top:3px}
.site .spark i{flex:1;background:var(--raise);position:relative;overflow:hidden}
.site .spark i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--accent);opacity:.8}
.mv.up{color:var(--match)} .mv.dn{color:var(--mismatch)}

/* console */
.console{border-top:1px solid var(--line);background:var(--ground);padding:10px 16px 10px;display:grid;grid-template-columns:1fr;gap:8px;z-index:4}
#app.is-hero .console{opacity:.0;pointer-events:none}
.console{transition:opacity .6s}
.sliders{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px 18px}
.sl{display:flex;flex-direction:column;gap:4px;min-width:0}
.sl label{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--ink-2);align-items:baseline}
.sl label b{font:500 12px/1 var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.sl .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl .foot{display:flex;justify-content:space-between;gap:6px;align-items:center}
.sl .share{font:400 10px/1 var(--f-mono);color:var(--ink-3)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:linear-gradient(90deg,var(--accent) var(--p,33%),var(--line-2) var(--p,33%))}
input[type=range]::-moz-range-track{height:3px;background:var(--line-2)}
input[type=range]::-moz-range-progress{height:3px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:16px;margin-top:-6.5px;background:var(--ink);border-radius:1px;border:0}
input[type=range]::-moz-range-thumb{width:12px;height:16px;background:var(--ink);border-radius:1px;border:0}
input[type=range]:disabled{opacity:.35}
.profiles{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.con-side{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.disclaimer{font-size:10.5px;color:var(--ink-3);max-width:78ch;text-align:right;line-height:1.35;flex:1 1 340px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(4,6,8,.72);display:flex;justify-content:center;align-items:flex-start;padding:4vh 16px;overflow-y:auto}
.sheet-card{background:var(--panel);border:1px solid var(--line-2);border-radius:4px;width:min(880px,100%);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.sheet-head h2{font:700 20px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;margin:0;flex:1}
.sheet-actions{display:flex;gap:6px}
.icon-btn{font-size:22px;line-height:1;width:32px;height:32px;border-radius:var(--r);color:var(--ink-2)}
.icon-btn:hover{background:var(--raise);color:var(--ink)}
.sheet-body{padding:18px 22px 26px}
.sheet-body h3{font:700 15px/1.2 var(--f-display);letter-spacing:.14em;text-transform:uppercase;margin:22px 0 8px;color:var(--ink-2)}
.sheet-body h3:first-child{margin-top:0}
pre.code{font:400 11.5px/1.55 var(--f-mono);background:var(--ground);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;overflow-x:auto;color:var(--ink-2);margin:0;white-space:pre}
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin:6px 0 4px}
.flow div{flex:1 1 110px;border:1px solid var(--line-2);padding:8px 10px;font:500 10px/1.35 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);position:relative;background:var(--panel-2)}
.flow div b{display:block;color:var(--ink);font:700 14px/1.1 var(--f-display);letter-spacing:.08em;margin-bottom:3px}
.flow div+div{border-left:0}
.formula{font:400 13px/1.9 var(--f-mono);background:var(--ground);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;color:var(--ink);overflow-x:auto;white-space:pre}
.callout{border-left:2px solid var(--partial);padding:8px 12px;background:rgba(216,180,91,.06);font-size:12.5px;color:var(--ink-2)}
.chip-list{display:flex;flex-wrap:wrap;gap:6px}
.whatif{border:1px solid var(--line-2);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel-2)}
.whatif q{font:700 17px/1.15 var(--f-display);letter-spacing:.04em;text-transform:uppercase;quotes:none}
.bfaf{display:flex;align-items:center;gap:14px}
.bfaf .b{display:flex;flex-direction:column}

<script>/* ASTERRO · Planetary Analogue Intelligence — deterministic engine (browser + Node).
 * Line-for-line port of src/compute/{similarity,ranking,clustering}.py.
 * Parity with the Python reference is asserted by tests/test_js_parity.mjs.
 * No randomness, no learned model, no generative component. */
(function (root) {
  "use strict";
  const MIN_COVERAGE = 0.80;
  const MATCH = 0.85, PARTIAL = 0.60;
  const R_EARTH_KM = 6371.0088;
  const N_CANDIDATES = 800, K_CHOICES = [3, 4, 5];
  const ALGORITHM_VERSION = "tai-sim-1.0.0";

  function activeCriteria(criteria, tv, w) {
    return criteria.filter(c => w[c] != null && +w[c] > 0 && tv[c] != null);
  }

  /* stack: {criterion: Float32Array}; returns Float64 arrays */
  function similarity(stack, criteria, tv, w, ranges) {
    for (const c of criteria) {
      if (w[c] == null) continue;
      if (!Number.isFinite(+w[c])) throw new Error("non-finite weight " + c);
      if (+w[c] < 0) throw new Error("negative weight " + c);
    }
    const act = activeCriteria(criteria, tv, w);
    if (!act.length) throw new Error("no active criteria");
    let totalW = 0; for (const c of act) totalW += +w[c];
    const n = stack[act[0]].length;
    const num = new Float64Array(n), wsum = new Float64Array(n);
    for (const c of act) {
      const e = stack[c], t = +tv[c], lo = ranges[c][0], span = ranges[c][1] - ranges[c][0], wc = +w[c];
      if (!(Number.isFinite(lo) && Number.isFinite(span) && span > 0)) throw new Error("undefined normalization range " + c);
      for (let i = 0; i < n; i++) {
        const x = e[i];
        if (x - x !== 0) continue;                   // NaN or ±Infinity: missing Earth value
        let s = 1 - Math.abs(x - t) / span;
        s = s < 0 ? 0 : (s > 1 ? 1 : s);
        num[i] += wc * s; wsum[i] += wc;
      }
    }
    const final = new Float64Array(n), coverage = new Float64Array(n), eff = new Float64Array(n);
    const eligible = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      final[i] = wsum[i] > 0 ? num[i] / wsum[i] : NaN;
      coverage[i] = wsum[i] / totalW;
      eligible[i] = coverage[i] >= MIN_COVERAGE - 1e-12 ? 1 : 0;
      eff[i] = eligible[i] && final[i] === final[i] ? final[i] : -1;
    }
    return { final, coverage, eligible, eff, active: act, totalW };
  }

  /* Full per-criterion breakdown for ONE cell (trace). */
  function detail(stack, criteria, i, tv, w, ranges) {
    const act = activeCriteria(criteria, tv, w);
    let wsum = 0; const rows = [];
    for (const c of criteria) {
      const e0 = stack[c][i], e = e0 - e0 === 0 ? e0 : NaN, t = tv[c], on = act.includes(c);
      const row = { c, e: e === e ? e : null, t, w: +(w[c] || 0), active: on, lo: ranges[c][0], hi: ranges[c][1] };
      if (on && e === e) {
        row.d = Math.abs(e - t) / (ranges[c][1] - ranges[c][0]);
        let s = 1 - row.d; row.s = s < 0 ? 0 : (s > 1 ? 1 : s);
        row.en = (e - ranges[c][0]) / (ranges[c][1] - ranges[c][0]);
        row.tn = (t - ranges[c][0]) / (ranges[c][1] - ranges[c][0]);
        wsum += row.w;
      } else if (e === e) {
        row.en = (e - ranges[c][0]) / (ranges[c][1] - ranges[c][0]);
        row.tn = t == null ? null : (t - ranges[c][0]) / (ranges[c][1] - ranges[c][0]);
      }
      rows.push(row);
    }
    let final = 0, num = 0;
    for (const r of rows) if (r.s != null) { r.k = r.w * r.s / wsum; num += r.w * r.s; }
    final = wsum > 0 ? num / wsum : NaN;
    let totalW = 0; for (const c of act) totalW += +w[c];
    return { rows, final, coverage: wsum / totalW, wsum, totalW };
  }

  function classify(s) { return s >= MATCH ? "MATCH" : (s >= PARTIAL ? "PARTIAL" : "MISMATCH"); }

  function order(eff, cell) {
    const n = eff.length, idx = new Int32Array(n);
    for (let i = 0; i < n; i++) idx[i] = i;
    idx.sort((a, b) => (eff[b] - eff[a]) || (cell[a] - cell[b]));
    return idx;
  }
  function ranksFromOrder(o) {
    const r = new Int32Array(o.length);
    for (let k = 0; k < o.length; k++) r[o[k]] = k + 1;
    return r;
  }
  function haversine(la1, lo1, la2, lo2) {
    const r = Math.PI / 180, p1 = la1 * r, p2 = la2 * r, dp = p2 - p1, dl = (lo2 - lo1) * r;
    let a = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
    a = a < 0 ? 0 : (a > 1 ? 1 : a);
    return 2 * R_EARTH_KM * Math.asin(Math.sqrt(a));
  }
  function distinctSites(o, lat, lon, n = 20, sep = 300) {
    const kept = [];
    for (let k = 0; k < o.length && kept.length < n; k++) {
      const i = o[k]; let ok = true;
      for (const j of kept) if (haversine(lat[i], lon[i], lat[j], lon[j]) < sep) { ok = false; break; }
      if (ok) kept.push(i);
    }
    return kept;
  }

  /* ---- clustering (constellations) ---- */
  function kmeans(X, d, k) {
    const n = X.length / d, C = new Float64Array(k * d), idx = [0];
    const dist = new Float64Array(n);
    const sq = (i, cRow, CC) => { let s = 0; for (let q = 0; q < d; q++) { const v = X[i * d + q] - CC[cRow * d + q]; s += v * v; } return s; };
    for (let q = 0; q < d; q++) C[q] = X[q];
    for (let i = 0; i < n; i++) dist[i] = sq(i, 0, C);
    for (let j = 1; j < k; j++) {
      let best = 0; for (let i = 1; i < n; i++) if (dist[i] > dist[best]) best = i;
      idx.push(best); for (let q = 0; q < d; q++) C[j * d + q] = X[best * d + q];
      for (let i = 0; i < n; i++) { const v = sq(i, j, C); if (v < dist[i]) dist[i] = v; }
    }
    let lab = new Int32Array(n);
    for (let it = 0; it < 100; it++) {
      const nl = new Int32Array(n);
      for (let i = 0; i < n; i++) {
        let b = 0, bv = Infinity;
        for (let j = 0; j < k; j++) { const v = sq(i, j, C); if (v < bv) { bv = v; b = j; } }
        nl[i] = b;
      }
      let same = it > 0; if (same) for (let i = 0; i < n; i++) if (nl[i] !== lab[i]) { same = false; break; }
      if (same) break;
      lab = nl;
      for (let j = 0; j < k; j++) {
        let m = 0; const acc = new Float64Array(d);
        for (let i = 0; i < n; i++) if (lab[i] === j) { m++; for (let q = 0; q < d; q++) acc[q] += X[i * d + q]; }
        if (m) for (let q = 0; q < d; q++) C[j * d + q] = acc[q] / m;
      }
    }
    return lab;
  }
  function silhouette(X, d, lab, k) {
    const n = lab.length; let tot = 0;
    const D = (i, j) => { let s = 0; for (let q = 0; q < d; q++) { const v = X[i * d + q] - X[j * d + q]; s += v * v; } return Math.sqrt(s); };
    for (let i = 0; i < n; i++) {
      const sum = new Float64Array(k), cnt = new Float64Array(k);
      for (let j = 0; j < n; j++) { if (j === i) continue; sum[lab[j]] += D(i, j); cnt[lab[j]]++; }

/* ===== 03 compute: deterministic pipeline (all numbers come from TAIEngine) ===== */
const TARGET_IDS = ["mars_jezero", "moon_south_pole"];
const simCache = new Map();

function simFor(tid, w) {
  const key = tid + "|" + S.critIds.map(c => (+w[c]).toFixed(4)).join(",");
  if (simCache.has(key)) return simCache.get(key);
  const r = ENG.similarity(S.A, S.critIds, S.T[tid].variables, w, S.ranges);
  if (simCache.size > 24) simCache.delete(simCache.keys().next().value);
  simCache.set(key, r); return r;
}
/* rank of one cell without sorting: 1 + #cells ordered ahead of it (same tie-break as the sort) */
function rankOf(eff, i) {
  if (eff[i] < 0) return null;
  const e = eff[i], c = S.cell[i]; let k = 1;
  for (let j = 0; j < S.n; j++) { const v = eff[j]; if (v > e || (v === e && S.cell[j] < c)) k++; }
  return k;
}
function effectiveFor(tid, w) {
  if (tid !== "cross") return simFor(tid, w).eff;
  const a = simFor(TARGET_IDS[0], w).eff, b = simFor(TARGET_IDS[1], w).eff, out = new Float64Array(S.n);
  for (let i = 0; i < S.n; i++) out[i] = (a[i] < 0 || b[i] < 0) ? -1 : Math.min(a[i], b[i]);
  return out;
}

function compute() {
  const t0 = performance.now(), tid = S.targetId, w = S.weights;
  let r = null, rJ = null, rM = null;
  if (tid === "cross") { rJ = simFor(TARGET_IDS[0], w); rM = simFor(TARGET_IDS[1], w); }
  else r = simFor(tid, w);
  const eff = effectiveFor(tid, w);
  const order = ENG.order(eff, S.cell);
  const rank = ENG.ranksFromOrder(order);
  let nElig = 0; for (let i = 0; i < S.n; i++) if (eff[i] >= 0) nElig++;
  const distinct = ENG.distinctSites(order, S.lat, S.lon, 20, S.app.thresholds.distinct_sep_km);
  const hi = eff[order[0]], lo = eff[order[Math.floor(nElig / 2)]];
  const active = tid === "cross" ? Array.from(new Set([...rJ.active, ...rM.active])) : r.active;
  S.res = { tid, w: { ...w }, r, rJ, rM, eff, order, rank, nElig, distinct, lo, hi, active, clusters: null };
  S.computeMs = performance.now() - t0;
  scheduleClusters();
  return S.res;
}

let clusterTimer = null;
function scheduleClusters() {
  clearTimeout(clusterTimer);
  clusterTimer = setTimeout(() => { computeClusters(); paintField(); renderAll(["right", "left"]); }, 140);
}
function normOf(i, c) { const v = S.A[c][i], R = S.ranges[c]; return v === v ? (v - R[0]) / (R[1] - R[0]) : NaN; }
function computeClusters() {
  const R = S.res; if (!R) return;
  const cl = ENG.constellations(R.order, R.active, normOf);
  const groups = [];
  for (let g = 0; g < cl.k; g++) groups.push({ id: g, members: [] });
  cl.candidates.forEach((i, r) => groups[cl.labels[r]].members.push(i));
  for (const G of groups) {
    const m = G.members, mean = f => { let s = 0, k = 0; for (const i of m) { const v = f(i); if (v === v) { s += v; k++; } } return k ? s / k : NaN; };
    G.stats = { aridity: mean(i => S.A.aridity[i]), t2m_mean_c: mean(i => S.A.t2m_mean_c[i]), slope: mean(i => S.A.slope[i]),
                elevation: mean(i => S.A.elevation[i]), lst: mean(i => S.A.lst_diurnal_range[i]), score: mean(i => R.eff[i]) };
    G.name = ENG.describe(G.stats);
    G.area = m.reduce((a, i) => a + cellArea(i), 0);
    G.best = m[0];                         // members are in rank order
    const cc = new Map(); for (const i of m) { const k = placeName(i).secondary || placeName(i).primary; cc.set(k, (cc.get(k) || 0) + 1); }
    G.countries = [...cc.entries()].sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1)).slice(0, 3);
  }
  // order constellations by mean score (deterministic), keep ids for colours
  groups.sort((a, b) => b.stats.score - a.stats.score || a.id - b.id);
  groups.forEach((G, k) => G.rankNo = k + 1);
  R.clusters = { k: cl.k, silhouette: cl.silhouette, groups, member: new Int8Array(S.n).fill(-1), threshold: R.eff[cl.candidates[cl.candidates.length - 1]] };
  for (const G of groups) for (const i of G.members) R.clusters.member[i] = G.rankNo - 1;
}

/* per-cell breakdown (trace) — current or arbitrary weights */
function detailFor(tid, i, w = S.weights) { return ENG.detail(S.A, S.critIds, i, S.T[tid].variables, w, S.ranges); }

function paintField() {
  const R = S.res, g = window.GLOBE; if (!R || !g) return;
  const d = g.fieldData; d.fill(0);
  const n = R.nElig, prev = S.prev && S.prev.tid === R.tid ? S.prev : null;
  const pN = prev ? Math.max(1, prev.nElig - 1) : 1, dMax = 0.25;   // change layer: relative-rank (percentile) change
  for (let k = 0; k < S.n; k++) {
    const i = R.order[k], c = S.cell[i] * 4, e = R.eff[i];
    d[c] = e < 0 ? 0 : Math.round(e * 255);
    d[c + 1] = e < 0 ? 255 : Math.round(255 * (1 - k / Math.max(1, n - 1)));
    d[c + 2] = R.clusters ? R.clusters.member[i] + 1 : 0;
    let code = 128;
    if (prev && e >= 0 && prev.eff[i] >= 0) {
      const pNow = 1 - k / Math.max(1, n - 1), pWas = 1 - (prev.rank[i] - 1) / pN;
      code = Math.round(128 + clamp((pNow - pWas) / dMax, -1, 1) * 127);

/* analogue evolution: yearly LST replaces the climatological LST, everything else fixed */
function evolution(tid, i, w = S.weights) {
  const Y = S.app.stack.years, out = [];
  const yr = S.A.lst_diurnal_range_yearly;
  for (let y = 0; y < Y.length; y++) {
    const raw = yr[y * S.n + i]; const v = raw === -32768 ? NaN : raw * 0.01;
    const st = {}; for (const c of S.critIds) st[c] = new Float32Array([c === "lst_diurnal_range" ? v : S.A[c][i]]);
    const scoreOf = t => { const r = ENG.similarity(st, S.critIds, S.T[t].variables, w, S.ranges); return r.eff[0]; };
    const s = tid === "cross" ? Math.min(scoreOf(TARGET_IDS[0]), scoreOf(TARGET_IDS[1])) : scoreOf(tid);
    out.push({ year: Y[y], lst: v, score: v === v ? s : null });
  }
  const sc = out.filter(o => o.score != null && o.score >= 0).map(o => o.score);
  const range = sc.length ? (Math.max(...sc) - Math.min(...sc)) * 100 : null;
  const cls = range == null ? "DATA NOT AVAILABLE" : (range <= S.app.thresholds.evolution_stable_pts ? "STABLE ANALOGUE" : "VARIABLE ANALOGUE");
  return { series: out, rangePts: range, cls, years: sc.length };
}

function stability(tid, i) {
  const rows = [];
  for (const [pid, p] of Object.entries(S.app.profiles)) {
    const eff = effectiveFor(tid, p.weights); rows.push({ pid, label: p.label, rank: rankOf(eff, i), score: eff[i] });
  }
  return rows;
}
function profileFor(i, w = S.weights) {   // reverse search: one Earth cell against every target
  return TARGET_IDS.map(t => { const r = simFor(t, w); return { tid: t, score: r.eff[i], rank: rankOf(r.eff, i), cov: r.coverage[i] }; });
}

  const a = simFor(TARGET_IDS[0], w).eff, b = simFor(TARGET_IDS[1], w).eff, idx = [];
  for (let i = 0; i < S.n; i++) if (a[i] >= 0 && b[i] >= 0) idx.push(i);
  idx.sort((x, y) => (a[y] - a[x]) || (b[y] - b[x]) || (S.cell[x] - S.cell[y]));
  const front = []; let best = -1;

}
function dataQuality(i, tid) {
  const t = tid === "cross" ? null : S.T[tid];
  const w = S.weights, act = S.res.active;
  let proxies = 0; const tl = tid === "cross" ? TARGET_IDS.map(x => S.T[x]) : [t];
  const pset = new Set(); for (const tt of tl) for (const c of act) if (tt.proxy_flags[c] && +w[c] > 0) pset.add(c);

  S.selected = null; S.picked = null;

async function runSearch() {
  if (S.searched) return;
  S.searched = true;
  const app = $("#app"); app.classList.remove("is-hero");
  GLOBE.autoRotate = false;
  const n = S.n.toLocaleString();

  $("#right").innerHTML = `<div class="rail-head"><div class="lbl">Analogue field</div><div class="meta">Comparing ${n} Earth cells…</div></div>`;
  GLOBE.animate("grid", 1, 700); GLOBE.animate("baseMix", 1, 1400);
  if (S.proj === 1) setTimeout(() => { GLOBE.resize(); GLOBE.animate("dist", GLOBE.mapFit(), 600); }, 900);
  const tgt = S.T[S.targetId] || S.T.mars_jezero;
  if (S.targetId !== "cross") GLOBE.flyTo(15, S.targetId === "moon_south_pole" ? -60 : -30);
  renderStatus(`fingerprint of ${TNAME[S.targetId]} applied to all ${n} cells — revealing from lowest to highest similarity`);
  const wait = ms => new Promise(r => setTimeout(r, REDUCED ? 0 : ms));
  await wait(500);
  GLOBE.animate("reveal", 1, 2600, t => t * t * (3 - 2 * t));

  await wait(1700);

  const total = D.design.length + oat.length;

  if (run.cancelled) return null;
  const orun = await LAB.runDesign({ Ps, cell: S.cell, cand, baseW, design: oat, onProgress: d => onProgress ? onProgress(D.design.length + d, total) : true });
  if (orun.cancelled) return null;
  const cov = cand.map(i => coverageOf(tid, i, baseW));
  const st = LAB.rankStats(run, { topPct: cfg.topPct, topN: cfg.topN, stableFrac: cfg.stableFrac, moderateFrac: cfg.moderateFrac, coverage: cov });
  const sens = LAB.oatSensitivity(orun, oat), flips = LAB.pairFlips(run);

/* ===== Phase II · Observation Value Engine =====
 * Formal value-of-information analysis needs a decision, utilities, an uncertainty model and a

 * Robustness Laboratory's recorded outputs. It never reports information gain or value. */
const VOI_CONDITIONS = [
  ["A clearly defined decision or research objective", false, "Objectives are free text in the Planner; no decision rule or alternatives are formalised."],
  ["A defined uncertainty model", false, "Only measured variability, a decoding bound and alternative statistics exist (Uncertainty explorer); no probability distributions."],
  ["A defined set of possible observations", true, "Finer-scale terrain (sub-cell DEM), in-situ thermal measurements, longer temporal records."],
  ["A model of how observations change beliefs or decisions", false, "No likelihood model links new data to rankings."],
  ["A measurable outcome or decision utility", false, "None defined."],
  ["Explicit assumptions and limitations", true, "Documented here and in docs/phase2/METHODS.md."],
];
const OBS_FOR = {
  slope: { obs: "Higher-resolution slope (e.g. sub-cell DEM distribution)", why: "Earth slope is one cell mean of 926.6 m slopes; the within-cell distribution was not retained.", test: "Obtain a finer DEM for both areas, recompute the slope distribution, and check whether the two sites keep their order." },
  surface_roughness: { obs: "Sub-cell roughness / terrain distribution", why: "Roughness is one SD over a ~55 km cell.", test: "Compute roughness at several window sizes from a finer DEM for both areas." },
  lst_diurnal_range: { obs: "In-situ or higher-resolution thermal observations at matched local times", why: "MODIS values are colour-map decoded (0.6 K bins) and aggregated; target values are rover point or 240 m window statistics.", test: "Compare MODIS science-file (HDF) values or field radiometry for both areas; check sensitivity of the order to ±0.6 K." },
  annual_temperature_range: { obs: "Multi-year air-temperature records", why: "Earth uses a 20-year climatology without interannual values; Mars covers one year.", test: "Recompute the range per year for both areas and see whether the order is stable." },

    <p class="note">Which additional measurements could best help distinguish candidates whose order is ambiguous? Recommendations are derived from recorded analyses and say what would test them.</p>

    </tbody></table></div><div class="callout">Formal VOI is <b>blocked</b> (4 of 6 conditions unmet). A qualitative evidence-priority analysis is given instead; no expected information gain, value or probability is reported.</div></div>`;
  if (!R) return h + `<div class="sec"><div class="empty">Run an experiment in the <button class="lnk" data-lab="goto" data-to="robust">Robustness Laboratory</button> for the current configuration first; the disagreement analysis uses its recorded outputs.</div></div>`;
  const tid = S.targetId, flips = R.flips.filter(f => f.frac >= 0.2).slice(0, 8), act = R.act;
  const sA = (c, i) => simC(c, i);
  const recs = flips.map(f => {
    const a = R.cand[f.a], b = R.cand[f.b];

    contrib.sort((x, y) => (y.flipsOAT - x.flipsOAT) || (Math.abs(y.wds) - Math.abs(x.wds)));

  });

      <dt>Why this evidence is weak now</dt><dd>${esc(r.O.why)}</dd><dt>Generated from</dt><dd>Robustness record ${R.rec.id} (pair ${siteNo(r.a)}/${siteNo(r.b)}, ${r.f.flips}/${R.D.design.length} flips; one-at-a-time flips by criterion: ${r.contrib.map(x => `${shortOf(x.c)} ${x.flipsOAT}`).join(", ")})</dd>
      <dt>Evidence needed to test it</dt><dd>${esc(r.O.test)}</dd><dt>Category</dt><dd>${evTag("INFERRED")} heuristic priority; not a value-of-information estimate</dd></dl></div>`).join("")}</div>`;
  return h;

async function verifyRecord(r) {

  const id = (await LAB.sha256Hex(LAB.canonical(cfg))).slice(0, 16);
  (id === r.id ? ok : issues).push(id === r.id ? "Configuration hash matches record id." : `Configuration hash ${id} ≠ record id ${r.id} (record edited or corrupted).`);
  const oh = await LAB.sha256Hex(LAB.canonical(r.outputs));
  (oh === r.outputs_sha256 ? ok : issues).push(oh === r.outputs_sha256 ? "Stored outputs match their checksum." : "Stored outputs do not match their checksum.");
  const b = r.baseline || {};
  if (b.predictor_stack && b.predictor_stack.sha256 !== S.app.stack.sha256) issues.push(`Missing dependency: record needs predictor stack ${b.predictor_stack.sha256.slice(0, 12)}…; this app has ${S.app.stack.sha256.slice(0, 12)}…. Replay impossible here.`);
  else ok.push("Predictor stack available (SHA-256 matches).");
  if (b.algorithm_version !== S.app.algorithm_version) issues.push(`Algorithm version ${b.algorithm_version} ≠ ${S.app.algorithm_version}.`); else ok.push("Algorithm version matches.");
  if (b.phase2_version !== LAB.VERSION) issues.push(`Phase II version ${b.phase2_version} ≠ ${LAB.VERSION}; results may differ.`); else ok.push("Phase II version matches.");

  return { ok, issues };
}
async function replayRecord(r) {

  const toIdx = cells => cells.map(c => S.index[c]);
  let out;
  if (r.module === "robustness") {
    const cand = toIdx(r.params.candidates); if (cand.some(i => i < 0)) return { status: "BLOCKED", text: "A candidate cell is not in this stack." };
    L.busy = { label: "Replaying " + r.id, done: 0, total: 1, cancel: false }; labRender();
    const X = await robustCompute(b.target, b.weights, cand, r.params, (d, t) => { L.busy.done = d; L.busy.total = t; busyUpdate(); return !L.busy.cancel; });
    L.busy = null; if (!X) return { status: "CANCELLED", text: "Replay cancelled." };
    out = X.outputs;

function diffObj(a, b, path = "", out = []) {
  if (LAB.canonical(a) === LAB.canonical(b)) return out;

    for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) diffObj(a[k], b[k], path ? path + "." + k : k, out);
  } else out.push({ path, a: LAB.canonical(a), b: LAB.canonical(b) });
  return out;
}

}

    say("DERIVED", "Largest contributions: " + top.map(r => `${labelOf(r.c)} ${(100 * r.k).toFixed(1)} pts (s = ${r.s.toFixed(3)})`).join("; ") + ".", "Trace result breakdown");
    const prox = top.filter(r => T.proxy_flags[r.c]); if (prox.length) say("ASSUMED", `${prox.map(r => labelOf(r.c)).join(" and ")} ${prox.length > 1 ? "are" : "is a"} PROXY criteri${prox.length > 1 ? "a" : "on"}; ${prox.length > 1 ? "their" : "its"} contribution reflects a modelling choice, not a measured planetary match.`, "targets.json status");
    say("UNVALIDATED", "A high rank means similar values of the selected modelled variables; it has not been validated as an analogue for any activity.", "ASTERRO interpretation statement");
  } else if (q === "reduced") {
    const L2 = lossRows(i, tid, w).filter(r => r.loss != null).slice(0, 3);
    say("DERIVED", "Largest losses: " + L2.map(r => `${labelOf(r.c)} −${r.loss.toFixed(1)} pts (Earth ${fmtVal(r.c, r.e)} vs target ${fmtVal(r.c, r.t)} ${unitOf(r.c)})`).join("; ") + ".", "Failure-mode laboratory");
    const miss = d.rows.filter(r => r.active && r.e == null); if (miss.length) say("UNAVAILABLE", "No Earth value for " + miss.map(r => labelOf(r.c)).join(", ") + "; excluded and the score renormalised.", "predictor stack");
  } else if (q === "unmodelled") {
    const mf = L.ctx ? L.ctx.catalog.missing_factors : [];
    say("UNAVAILABLE", "Not evaluated: " + mf.filter(f => f.status === "UNMODELED").map(f => f.label.toLowerCase()).join(", ") + ".", "src/phase2/catalog.py");
    say("ASSUMED", "Atmospheric pressure enters only through the elevation proxy ('thin atmosphere').", "targets.json proxy_method");
    say("MEASURED", "Absolute temperature level is not in the score; the Failure-mode laboratory compares it separately using MODIS, MEDA and Diviner values.", "Failure-mode laboratory");
  } else if (q === "datasets") {
    for (const r of d.rows.filter(x => x.active)) { const cr = S.crit.find(x => x.id === r.c), ds = cr.earth_source.map(id => S.app.datasets.find(x => x.id === id));
      say(T.status[r.c] === "PROXY" ? "ASSUMED" : "MEASURED", `${labelOf(r.c)}: Earth from ${ds.map(x => x.dataset.split(";")[0] + " (" + x.version + ")").join(", ")}; target ${T.status[r.c]} — ${T.methodology[r.c].slice(0, 120)}…`, "app.json datasets · targets.json methodology"); }
    say("DERIVED", `Predictor stack SHA-256 ${S.app.stack.sha256.slice(0, 16)}… (${S.hashOK === true ? "verified in this browser" : "not verified in this browser"}).`, "data integrity check");
  } else if (q === "sensitive") {
    const R = L.res.robust && L.res.robust.key === baseKey() ? L.res.robust : null, k = R ? R.cand.indexOf(i) : -1;
    if (k >= 0) say("DERIVED", `Across ${R.D.design.length} configurations (${R.D.name}): median rank #${R.st[k].median}, range #${R.st[k].min}–#${R.st[k].max}; ${LAB.CLASS_LABEL[R.st[k].cls].toLowerCase()} under the documented rule. Most sensitive single weight: ${labelOf(R.sens[k].driver)}.`, "Robustness record " + R.rec.id);
    else say("UNAVAILABLE", "No robustness experiment for this candidate and configuration yet; run one in the Robustness Laboratory.", "—");
  } else if (q === "measure") {
    const R = L.res.robust && L.res.robust.key === baseKey() ? L.res.robust : null;
    if (!R) say("UNAVAILABLE", "Needs a robustness experiment (Observation value engine uses its pair-flip analysis).", "—");
    else { const fl = R.flips.filter(f => f.frac >= 0.2); say("INFERRED", fl.length ? `${fl.length} candidate pair(s) change order in ≥ 20 % of tested weightings; see the Observation value engine for the criterion behind each and the evidence that would test it.` : "No pair changes order in ≥ 20 % of tested weightings; no measurement is singled out.", "Robustness record " + R.rec.id); }
    say("UNAVAILABLE", "Formal value-of-information is not computed (no decision utility or likelihood model).", "Observation value engine");
  }
  return out;
}
function numberCheck(text) {
  const sc = new Set(); for (const i of S.res.distinct) for (const t of TARGET_IDS) { const e = simFor(t, S.weights).eff[i]; if (e >= 0) { sc.add((100 * e).toFixed(1)); sc.add((100 * e).toFixed(0)); } }
  for (const i of S.res.distinct) { sc.add((100 * S.res.eff[i]).toFixed(1)); sc.add((100 * S.res.eff[i]).toFixed(0)); }
  const out = []; const re = /(\d+(?:\.\d+)?)\s?%/g; let m;
  while ((m = re.exec(text))) out.push({ at: m.index, match: m[0], ok: sc.has((+m[1]).toFixed(m[1].includes(".") ? 1 : 0)) });
  return out;
}
LAB_VIEWS.review = function () {
  if (!S.res) return `<div class="sec"><div class="empty">Run the search first.</div></div>`;
  const i = labSel();
  let h = `<div class="sec"><h3 class="ttl">Scientific review</h3>
    <div class="callout"><b>Language-model copilot: not implemented.</b> This static build has no model service, and no model may compute, change, rank or explain a score. The questions below are answered deterministically from computed outputs, each statement tagged with its evidence category and source.</div></div>
    <div class="sec"><div class="lbl">Evidence-grounded questions · ${esc(candShort(i))}</div><div class="chip-list">${QUESTIONS.map(([k, t]) => `<button class="btn-sm${L.rev.q === k ? " on" : ""}" data-lab="rv-q" data-q="${k}">${esc(t)}</button>`).join("")}</div>`;
  if (L.rev.q) h += `<div class="rv-ans">${answer(L.rev.q, i).map(s => `<div class="ev-row"><div class="row">${evTag(s.cat)}<span class="meta">source: ${esc(s.src)}</span></div><div class="ev-text">${esc(s.text)}</div></div>`).join("")}</div>`;
  h += `</div><div class="sec"><div class="lbl">Unsupported-claim check</div><p class="note small">Paste report text. Flags equivalence, certification, safety, suitability, validation, habitability, authority, proof, optimality, probability and future-projection language, and percentages that match no displayed Analogue Score.</p>
    <textarea class="lab-ta" rows="5" data-labin="rv-text" placeholder="e.g. The Altiplano is scientifically identical to Jezero and certified safe for rover tests (85%).">${esc(L.reviewText)}</textarea>
    <div class="row"><button class="btn-sm on" data-lab="rv-run">Review text</button>${L.plan && L.plan.out ? `<button class="btn-sm" data-lab="rv-plan">Review the generated plan</button>` : ""}</div>`;
  if (L.rev.flags) {
    h += L.rev.flags.length || L.rev.nums.some(n => !n.ok) ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Found</th><th>Issue</th><th>Prefer</th></tr></thead><tbody>
      ${L.rev.flags.map(f => `<tr><td><b>${esc(f.match)}</b></td><td class="meta">${esc(f.issue)}</td><td>“${esc(f.prefer)}”</td></tr>`).join("")}
      ${L.rev.nums.filter(n => !n.ok).map(n => `<tr><td><b>${esc(n.match)}</b></td><td class="meta">Number matches no baseline score of the top-20 sites shown</td><td>cite the value from Trace result</td></tr>`).join("")}</tbody></table></div>`
      : `<p class="note small c-match">No guardrail phrase found. This does not establish that the text is correct.</p>`;
  }
  return h + `</div>`;
};
LAB_ACTIONS["rv-q"] = a => { L.rev.q = a.dataset.q; if (a.dataset.q === "unmodelled") labCtx().then(labRender); labRender(); };
LAB_INPUTS["rv-text"] = a => { L.reviewText = a.value; };
LAB_ACTIONS["rv-run"] = () => { const ta = $("[data-labin=rv-text]"); if (ta) L.reviewText = ta.value; L.rev.flags = LAB.reviewText(L.reviewText); L.rev.nums = numberCheck(L.reviewText); labRender(); };
LAB_ACTIONS["rv-plan"] = () => { L.reviewText = planMarkdown(L.plan.out); L.rev.flags = LAB.reviewText(L.reviewText); L.rev.nums = numberCheck(L.reviewText); labRender(); };
</script>
