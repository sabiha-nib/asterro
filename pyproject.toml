[project]
name = "asterro"
version = "1.0.0"
description = "ASTERRO - Planetary Analogue Intelligence: deterministic search for Earth environmental analogues of Moon/Mars targets"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
ingest = ["requests", "pillow", "rasterio", "netCDF4", "pandas", "shapely", "pyshp"]
store = ["zarr>=2.16"]
test = ["pytest>=7", "playwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
